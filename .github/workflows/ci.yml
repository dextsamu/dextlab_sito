name: Controlli

# Gira su ogni pull request e su ogni push fuori da main. Su main lo richiama
# deploy.yml come prerequisito, così non esiste un deploy che salta i controlli
# e non ci sono due esecuzioni in parallelo sullo stesso commit.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

# Un push che ne segue un altro sullo stesso ramo annulla il precedente: i
# controlli sul commit sorpassato non servono più.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipi e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Controllo dei tipi
        run: npm run check

      # Le <img> del sito portano gli attributi width e height per riservare lo
      # spazio ed evitare lo scatto del layout. Quegli attributi valgono però
      # come altezza imposta: senza height:auto nel reset, qualsiasi regola che
      # cambi la larghezza stira l'immagine. È accaduto con il logo della
      # sezione About, deformato del 176% per mesi senza che nulla lo segnalasse.
      - name: Il reset delle immagini conserva le proporzioni
        run: |
          if ! grep -qE '^img\{[^}]*height:auto' public/css/style.css; then
            echo "::error::manca height:auto nel reset img di public/css/style.css: le immagini con attributi width/height si deformano"
            exit 1
          fi
          echo "  ok    reset img con height:auto"

          # .about-ring è un quadrato di 340px che gira: il cerchio disegnato non
          # si sposta, ma la sua area di ingombro arriva a 481px e trascinava la
          # pagina di lato su telefono, in modo intermittente perché legato
          # all'angolo. overflow-x su body non basta, deve stare su html.
          if ! grep -qE '^html\{[^}]*overflow-x:clip' public/css/style.css; then
            echo "::error::manca overflow-x:clip su html: gli elementi che ruotano trascinano la pagina di lato su telefono"
            exit 1
          fi
          echo "  ok    html con overflow-x:clip"

      # Un <link rel="stylesheet"> verso un altro host blocca l'esecuzione di
      # ogni <script> che lo segue nel documento. Con i caratteri presi da
      # Google, una loro lentezza o un blocco di rete fermava i18n.js e main.js:
      # niente traduzione, niente configuratore, e nessuna sezione scoperta.
      - name: I caratteri sono serviti dal sito, non da Google
        run: |
          fail=0
          if grep -rqE 'fonts\.(googleapis|gstatic)\.com' src/; then
            echo "::error::un collegamento a Google Fonts nei template blocca l'esecuzione degli script che lo seguono"
            fail=1
          else
            echo "  ok    nessun riferimento a Google Fonts nei template"
          fi
          for f in inter-latin inter-latin-ext space-grotesk-latin space-grotesk-latin-ext; do
            if [ -s "public/fonts/$f.woff2" ]; then
              echo "  ok    public/fonts/$f.woff2"
            else
              echo "::error::manca public/fonts/$f.woff2, dichiarato da un @font-face di style.css"
              fail=1
            fi
          done
          esterni=$(grep -oE 'url\((https?:)?//[^)]*\)' public/css/style.css || true)
          if [ -n "$esterni" ]; then
            echo "::error::il foglio di stile carica risorse da fuori: $esterni"
            fail=1
          fi
          exit $fail

      # Le sezioni .reveal partono invisibili e le scopre main.js. Se main.js non
      # arriva a girare, undici sezioni restano invisibili per sempre e la home
      # si riduce all'hero su fondo vuoto. Il paracadute è la classe .js
      # sull'<html>, che un timer ritira se main.js non si dichiara presente.
      - name: Il contenuto resta visibile senza JS
        run: |
          fail=0
          if grep -qE '^\.reveal\{[^}]*opacity:0' public/css/style.css; then
            echo "::error::.reveal parte nascosto senza condizione: se il JS non gira la pagina resta vuota"
            fail=1
          else
            echo "  ok    .reveal nascosto solo sotto .js"
          fi
          presente() {
            if grep -qF "$2" "$1"; then echo "  ok    $3"
            else echo "::error::$3 — non trovato in $1"; fail=1; fi
          }
          presente public/css/style.css '.js .reveal{' 'la regola nascosta è condizionata a .js'
          presente src/layouts/BaseLayout.astro "dataset.js !== 'on'" 'timer di sicurezza nel <head>'
          presente public/js/main.js "dataset.js = 'on'" 'main.js si dichiara presente'
          exit $fail

      # Due trappole silenziose nelle animazioni del fondo e delle comparse.
      - name: Le animazioni non si annullano fra loro
        run: |
          fail=0
          riga() { grep -n "$1" public/css/style.css | head -1 | cut -d: -f1; }

          # 1) Le regole per tipo di blocco hanno la stessa specificità di
          # .js .reveal.in, quindi se finiscono DOPO vincono loro e i blocchi
          # restano spostati anche una volta entrati: si vedrebbero card piccole
          # e l'About sfalsato, per sempre.
          fine=$(riga '^\.js \.reveal\.in{')
          if [ -z "$fine" ]; then
            echo "::error::non trovo la regola .js .reveal.in"
            fail=1
          else
            for r in '^\.js \.marquee\.reveal{' '^\.js \.about-visual\.reveal{' '^\.js \.about-text\.reveal{' '^\.js \.config\.reveal{'; do
              n=$(riga "$r")
              if [ -z "$n" ]; then
                echo "::error::manca la regola $r"
                fail=1
              elif [ "$n" -ge "$fine" ]; then
                echo "::error::$r è alla riga $n, dopo .js .reveal.in (riga $fine): l'arrivo non annullerebbe la partenza"
                fail=1
              else
                echo "  ok    $r precede .reveal.in"
              fi
            done
          fi

          # 2) L'accensione degli esagoni deve muovere solo l'opacità: la
          # posizione la scrive il JS mentre scorri, e due animazioni sulla
          # stessa proprietà si sovrascriverebbero a vicenda.
          kf=$(sed -n '/@keyframes esaTurno/,/}$/p' public/css/style.css)
          if [ -z "$kf" ]; then
            echo "::error::non trovo @keyframes esaTurno"
            fail=1
          elif grep -q 'transform' <<<"$kf"; then
            echo "::error::@keyframes esaTurno muove anche transform: entrerebbe in conflitto con la profondità scritta dal JS"
            fail=1
          else
            echo "  ok    esaTurno muove solo l'opacità"
          fi
          exit $fail

      # Le email si controllano senza spedirle: i messaggi si costruiscono con dati
      # d'esempio e si guarda cosa ne esce. Le regole provate sono quelle che si
      # rompono in silenzio — una versione testuale vuota, un link presente solo
      # nell'HTML, un tag scritto da chi prenota che diventa markup nella casella
      # di chi lo riceve.
      - name: Le email dicono la stessa cosa in HTML e in testo
        run: npm run --silent mail -- --verifica

      # Google Ads rifiuta un titolo di 31 caratteri e Meta taglia il testo a 125:
      # i conteggi accanto a ogni riga del kit non sono un ornamento, sono la sola
      # cosa che dice se un testo è pubblicabile. Qui si ricontano — e si verifica
      # anche che quelli scritti nel file siano ancora veri, perché un testo
      # modificato senza rieseguire lo script si porta dietro il numero di prima,
      # che è peggio di nessun numero.
      - name: I testi degli annunci stanno nei limiti
        run: |
          npm run --silent kit -- --verifica
          npm run --silent kit
          git diff --exit-code marketing/kit-marketing.html || {
            echo "::error::conteggi del kit stantii: esegui «npm run kit» e committa il file"
            exit 1
          }

      - name: Build
        run: npm run build

  smoke:
    name: Avvio contro un database reale
    runs-on: ubuntu-latest

    # Le migrazioni e le query vanno provate contro PostgreSQL, non simulate:
    # è lo stesso motore della produzione.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dext
          POSTGRES_PASSWORD: dext_ci
          POSTGRES_DB: dext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: dext
      DB_USER: dext
      DB_PASS: dext_ci
      # Valore usa-e-getta valido solo per questo job: non è un segreto reale.
      APP_SECRET: ci_only_secret_0123456789abcdef0123456789abcd
      SITE_URL: http://127.0.0.1:4321
      BACKUP_DIR: /tmp/ci-backups

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrazioni su database vuoto
        run: npm run migrate

      - name: Le migrazioni sono idempotenti
        run: |
          out=$(npm run --silent migrate)
          echo "$out"
          echo "$out" | grep -q 'già aggiornato' || {
            echo "::error::una seconda esecuzione ha riapplicato delle migrazioni"
            exit 1
          }

      - name: Creazione admin
        run: echo 'password-ci-molto-lunga' | npm run --silent create-admin -- --user ci_admin

      - run: npm run build

      - name: Avvio del server compilato
        run: |
          node ./dist/server/entry.mjs > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:4321/api/health && exit 0
            sleep 0.5
          done
          echo "::error::il server non ha risposto entro 20 secondi"
          cat /tmp/server.log
          exit 1

      - name: Le rotte rispondono
        run: |
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321$1")
            if [ "$code" = "$2" ]; then
              echo "  ok    $1 -> $code"
            else
              echo "::error::$1 ha risposto $code, attesi $2"
              fail=1
            fi
          }
          check /            200
          check /privacy     200
          check /termini     200
          check /sitemap.xml 200
          check /robots.txt  200
          check /api/health  200
          # I caratteri sono nostri: se non fossero serviti, il sito ripiegherebbe
          # sui font di sistema senza che nulla lo segnali.
          check /fonts/inter-latin.woff2          200
          check /fonts/space-grotesk-latin.woff2  200
          check /admin       200
          # Il pannello non deve essere raggiungibile senza sessione. Vale anche
          # per la pagina Marketing, che mostra da dove arrivano i contatti.
          check /admin/lead      303
          check /admin/marketing 303
          # La pagina del servizio protezione dati parte spenta: 404 è lo stato
          # giusto appena migrato, e la guardia dedicata prova l'accensione.
          check /gdpr            404
          # L'endpoint di backup resta chiuso senza BACKUP_KEY.
          check /api/backup  403
          exit $fail

      - name: I contenuti arrivano dal database
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          # Le recensioni non sono più in questo elenco: dopo la 005 il database
          # di prova non ne ha di attive, quindi la sezione non viene resa. Il
          # controllo su di loro è il passo successivo, ed è al contrario.
          for pair in "cfg-type:4" "cfg-addon:5" "faq-item reveal:3" "esa\":21"; do
            needle=${pair%:*}; want=${pair#*:}
            got=$(grep -o "class=\"$needle" <<<"$html" | wc -l)
            if [ "$got" != "$want" ]; then
              echo "::error::$needle presente $got volte, attese $want"
              exit 1
            fi
            echo "  ok    $needle x$got"
          done

      # Le recensioni sono l'unico contenuto senza ripiego: se il database non ne
      # ha, la sezione non esiste. Prima due firme d'esempio arrivavano dal codice
      # e la sezione c'era sempre, anche a database spento.
      - name: Senza recensioni vere la sezione non c'è
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          # Il database di prova, dopo la 005, non ha recensioni attive.
          for assente in 'class="review ' 'id="recensioni"' 'href="#recensioni"'; do
            if grep -qF "$assente" <<<"$html"; then
              echo "::error::senza recensioni attive la pagina contiene ancora $assente"
              fail=1
            else
              echo "  ok    niente $assente"
            fi
          done
          # Le firme del seed non devono ricomparire, né nella pagina né nel
          # codice. I testi esatti si prendono dalla 005 invece di riscriverli
          # qui: così il controllo resta vero anche se domani si aggiunge un
          # terzo esempio da ritirare, e non esiste una seconda copia da tenere
          # allineata. Per lo stesso motivo src/ non deve nominarli affatto —
          # nemmeno in un commento, perché una ricerca non distingue una
          # spiegazione da un ripiego tornato in servizio.
          firme=$(grep -oE "\('[A-Z][a-zA-Z]+ [A-Z]\.'," migrations/005_*.sql | grep -oE "'[^']+'" | tr -d "'")
          [ -n "$firme" ] || { echo "::error::non riesco a leggere le firme d'esempio dalla 005"; exit 1; }
          while read -r finta; do
            [ -n "$finta" ] || continue
            if grep -qF "$finta" <<<"$html"; then
              echo "::error::la pagina mostra la recensione d'esempio «$finta»"
              fail=1
            fi
            if grep -rqF "$finta" src/; then
              echo "::error::«$finta» è nominata in src/: le recensioni non hanno ripiego, e il nome non va scritto nel codice"
              fail=1
            fi
          done <<<"$firme"
          [ $fail = 0 ] && echo "  ok    nessuna recensione inventata, nel codice né nella pagina ($(wc -l <<<"$firme") firme controllate)"
          # Con una recensione vera in tabella la sezione deve tornare, altrimenti
          # questo controllo passerebbe anche se la sezione fosse rotta per sempre.
          PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -q -c \
            "insert into reviews (quote, author, role, stars, sort) values ('Recensione di prova della CI, non è un cliente.','Prova CI','Controlli automatici',5,99)"
          html2=$(curl -s http://127.0.0.1:4321/)
          for atteso in 'id="recensioni"' 'href="#recensioni"' 'Prova CI'; do
            if grep -qF "$atteso" <<<"$html2"; then echo "  ok    con una recensione vera torna $atteso"
            else echo "::error::inserita una recensione, manca ancora $atteso"; fail=1; fi
          done
          PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -q -c "delete from reviews where author='Prova CI'"
          exit $fail

      # I lavori per clienti. La regola della sezione è che tutto ciò che vi si
      # afferma sia verificabile: per un lavoro questo significa un indirizzo che
      # si apre. Una voce senza link non è un portfolio, è un'affermazione — e
      # come le recensioni non esiste un ripiego nel codice, perché un lavoro
      # inventato ha un indirizzo che chiunque può controllare.
      - name: I lavori portano al sito vero, o non ci sono
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          q() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -q -c "$1"; }
          qv() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -tA -c "$1"; }

          # 1) Nessun ripiego nel codice: se la tabella è vuota o spenta la
          # sezione resta il caso studio di questo sito, con le sue sei prove.
          if grep -qE 'FALLBACK_WORKS' src/lib/content.ts; then
            echo "::error::è comparso un ripiego per i lavori: un lavoro inventato ha un indirizzo che si può aprire"
            fail=1
          else
            echo "  ok    nessun ripiego per i lavori nel codice"
          fi
          # La 008 compila e attiva le tre righe che la 006 aveva lasciato in
          # bozza, quindi a database appena migrato le tre schede DEVONO esserci:
          # se una migrazione futura svuotasse la tabella la sezione tornerebbe
          # muta senza che nessuno se ne accorga. Il conto si fa sulle righe
          # attive e complete, non su un 3 scritto qui, altrimenti la guardia va
          # riscritta ogni volta che si aggiunge un lavoro dal pannello.
          attesi=$(qv "select count(*) from works where active and title <> '' and url ~ '^https?://'")
          n=$(grep -o 'class="lavoro"' <<<"$html" | wc -l)
          if [ "$n" != "$attesi" ]; then
            echo "::error::in tabella ci sono $attesi lavori mostrabili ma in pagina le schede sono $n"
            fail=1
          else
            echo "  ok    le $n schede in pagina sono i $attesi lavori mostrabili in tabella"
          fi
          [ "$attesi" -gt 0 ] \
            && echo "  ok    dopo le migrazioni un lavoro c'è: la sezione non è muta" \
            || { echo "::error::nessun lavoro mostrabile a database migrato: la 008 non ha compilato niente"; fail=1; }
          for dominio in sagrago.it poderelavandaro.it ristoranteatena.it; do
            grep -qF "$dominio" <<<"$html" \
              && echo "  ok    $dominio è in pagina" \
              || { echo "::error::$dominio non compare: la riga è stata svuotata o spenta"; fail=1; }
          done
          grep -qF 'class="prova"' <<<"$html" \
            && echo "  ok    il caso studio di questo sito resta al suo posto" \
            || { echo "::error::sono sparite le prove del caso studio"; fail=1; }

          # 1-bis) E la prova al contrario: spente tutte le righe, la sezione deve
          # tornare esattamente com'era prima che esistessero i lavori. È il
          # controllo che l'assenza di ripiego vale anche a runtime e non solo
          # come grep sul sorgente.
          q "update works set active = false"
          h0=$(curl -s http://127.0.0.1:4321/)
          n0=$(grep -o 'class="lavoro"' <<<"$h0" | wc -l)
          if [ "$n0" != 0 ]; then
            echo "::error::$n0 schede con la tabella tutta spenta: da qualche parte c'è un ripiego"
            fail=1
          else
            echo "  ok    con la tabella spenta non si mostra nessun lavoro"
          fi
          grep -qF 'Il sito che stai' <<<"$h0" \
            && echo "  ok    e la sezione torna a intitolarsi «Il sito che stai guardando»" \
            || { echo "::error::senza lavori l'intestazione non è tornata quella del caso studio"; fail=1; }
          grep -qF 'class="prova"' <<<"$h0" \
            && echo "  ok    con le sei prove al loro posto" \
            || { echo "::error::senza lavori sono sparite anche le prove"; fail=1; }
          # Si riaccende quello che la 008 aveva acceso: in CI il database è
          # appena migrato, quindi le righe complete sono esattamente quelle.
          q "update works set active = true where title <> '' and url <> ''"

          # 2) Una riga senza titolo o senza indirizzo non passa, nemmeno se
          # attiva: è il caso di chi spunta «active» su una bozza per sbaglio.
          q "insert into works (title, url, summary, tags, sort, active) values ('', 'https://senza-titolo.example/', 'x', '', 90, true)"
          q "insert into works (title, url, summary, tags, sort, active) values ('Senza indirizzo', '', 'x', '', 91, true)"
          h2=$(curl -s http://127.0.0.1:4321/)
          for spia in 'senza-titolo.example' 'Senza indirizzo'; do
            if grep -qF "$spia" <<<"$h2"; then
              echo "::error::una riga incompleta («$spia») è finita in pagina"
              fail=1
            else
              echo "  ok    la riga incompleta «$spia» viene scartata"
            fi
          done

          # 3) Un lavoro completo compare, con un link vero e le protezioni
          # d'obbligo su target=_blank.
          q "insert into works (title, url, summary, tags, sort, active) values ('Prova CI', 'https://esempio.example/', 'Riga di prova.', 'Uno, Due', 92, true)"
          h3=$(curl -s http://127.0.0.1:4321/)
          for atteso in 'Prova CI' 'esempio.example' 'class="lavoro"'; do
            grep -qF "$atteso" <<<"$h3" || { echo "::error::un lavoro completo non compare: manca $atteso"; fail=1; }
          done
          # Ogni scheda deve essere un link http(s) con rel="noopener": senza,
          # la pagina aperta può manipolare quella che l'ha aperta.
          schede=$(grep -o 'class="lavoro"><a [^>]*>' <<<"$h3" || true)
          [ -n "$schede" ] || { echo "::error::non trovo il link dentro la scheda del lavoro"; fail=1; }
          while read -r a; do
            [ -n "$a" ] || continue
            grep -qE 'href="https?://' <<<"$a" || { echo "::error::una scheda non punta a un indirizzo http(s): $a"; fail=1; }
            grep -q 'rel="noopener' <<<"$a" || { echo "::error::una scheda apre in una nuova finestra senza rel=noopener: $a"; fail=1; }
          done <<<"$schede"
          [ $fail = 0 ] && echo "  ok    la scheda è un link http(s) con rel=noopener"
          # E la sezione cambia intestazione quando i lavori ci sono, altrimenti
          # resterebbe «Un caso reale» sopra un elenco di lavori.
          grep -qF 'Siti che sono' <<<"$h3" \
            && echo "  ok    con i lavori la sezione si intitola diversamente" \
            || { echo "::error::con i lavori presenti l'intestazione è rimasta quella del caso studio"; fail=1; }
          grep -qF 'class="prova"' <<<"$h3" \
            && echo "  ok    e il caso studio resta anche con i lavori" \
            || { echo "::error::i lavori hanno mangiato il caso studio"; fail=1; }

          # 4) «Progetto mio» compare solo dove è segnato. Confondere un prodotto
          # nato da sé con una commessa non è modestia, è un'informazione
          # sbagliata — e il contrario è un vanto non dovuto.
          # Non si può più pretendere zero etichette: la 007 segna sagrago.it come
          # progetto proprio e la 008 lo attiva, quindi una etichetta legittima in
          # pagina c'è. Il conto va fatto contro la tabella — così la guardia
          # continua a valere quando i lavori propri diventeranno due.
          mio_attesi=$(qv "select count(*) from works where active and proprio and title <> '' and url ~ '^https?://'")
          mio_pagina=$(grep -o 'class="lavoro-mio"' <<<"$h3" | wc -l)
          if [ "$mio_pagina" != "$mio_attesi" ]; then
            echo "::error::etichette «progetto mio» in pagina: $mio_pagina, righe segnate in tabella: $mio_attesi"
            fail=1
          else
            echo "  ok    le etichette «progetto mio» in pagina ($mio_pagina) sono le righe segnate come tali"
          fi
          q "update works set proprio = true where sort = 92"
          h4=$(curl -s http://127.0.0.1:4321/)
          mio_dopo=$(grep -o 'class="lavoro-mio"' <<<"$h4" | wc -l)
          [ "$mio_dopo" = "$((mio_attesi + 1))" ] \
            && echo "  ok    e ne compare una in più quando si segna un altro lavoro come proprio" \
            || { echo "::error::segnato un altro lavoro come proprio, le etichette dovevano essere $((mio_attesi + 1)) e sono $mio_dopo"; fail=1; }

          q "delete from works where sort in (90, 91, 92)"
          exit $fail

      # La pagina di un lavoro. Esiste solo se c'è un testo da metterci, e deve
      # continuare a portare al sito vero: è un approfondimento della prova, non
      # il suo sostituto. Se un giorno la scheda smettesse di puntare al sito e
      # puntasse solo qui, la sezione avrebbe perso la cosa che la rende diversa
      # da un racconto.
      - name: Ogni lavoro ha la sua pagina, o non ce l'ha
        run: |
          fail=0
          q() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -q -c "$1"; }
          qv() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -tA -c "$1"; }
          html=$(curl -s http://127.0.0.1:4321/)
          sitemap=$(curl -s http://127.0.0.1:4321/sitemap.xml)

          # 1) Tante voci «Com'è fatto» quante sono le righe con un testo: né una
          # in più (pagina vuota) né una in meno (lavoro fatto che nessuno vede).
          attese=$(qv "select count(*) from works where active and title <> '' and url ~ '^https?://' and story <> ''")
          pagine=$(grep -o 'class="lavoro-piu" href="/lavori/[^"]*"' <<<"$html" | wc -l)
          if [ "$pagine" != "$attese" ]; then
            echo "::error::righe con un testo: $attese, voci «Com'è fatto» in pagina: $pagine"
            fail=1
          else
            echo "  ok    le $pagine voci «Com'è fatto» sono le righe che hanno un testo"
          fi

          # 2) Ogni pagina risponde, e da lì si arriva al sito vero. Gli indirizzi
          # si leggono dalla home invece di ricostruire il nome dal dominio: se un
          # giorno la convenzione cambia, questa guardia continua a valere.
          for href in $(grep -o 'class="lavoro-piu" href="/lavori/[^"]*"' <<<"$html" | sed 's/.*href="//;s/"//'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321$href")
            if [ "$code" != 200 ]; then
              echo "::error::$href risponde $code: la scheda porta a una pagina che non c'è"
              fail=1
              continue
            fi
            pag=$(curl -s "http://127.0.0.1:4321$href")
            grep -qE 'href="https?://[^"]+"[^>]*rel="noopener' <<<"$pag" \
              && echo "  ok    $href porta al sito vero con rel=noopener" \
              || { echo "::error::$href non ha un link al sito vero con rel=noopener"; fail=1; }
            # Qui main.js non viene caricato: una classe .reveal renderebbe la
            # pagina invisibile fino allo scadere del timer di sicurezza.
            if grep -q 'class="[^"]*reveal' <<<"$pag"; then
              echo "::error::$href usa .reveal, ma su questa pagina main.js non gira: resterebbe vuota"
              fail=1
            else
              echo "  ok    $href non dipende da main.js per farsi vedere"
            fi
            grep -qF "$href" <<<"$sitemap" \
              && echo "  ok    $href è nella sitemap" \
              || { echo "::error::$href non è nella sitemap"; fail=1; }
          done

          # 3) Un indirizzo inventato risponde 404 e non una pagina vuota con
          # l'intestazione.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/lavori/inventato)
          [ "$code" = 404 ] \
            && echo "  ok    un lavoro che non esiste risponde 404" \
            || { echo "::error::/lavori/inventato ha risposto $code, atteso 404"; fail=1; }

          # 4) E la prova al contrario: un lavoro completo ma senza testo non ha
          # la pagina, e la scheda non la offre. Poi si scrive il testo e compare.
          q "insert into works (title, url, summary, tags, sort, active) values ('Senza testo CI', 'https://senza-testo.example/', 'Riga di prova.', '', 93, true)"
          h1=$(curl -s http://127.0.0.1:4321/)
          grep -qF 'Senza testo CI' <<<"$h1" \
            || { echo "::error::il lavoro di prova non compare nemmeno come scheda"; fail=1; }
          if grep -qF 'href="/lavori/senza-testo"' <<<"$h1"; then
            echo "::error::un lavoro senza testo offre la pagina: porterebbe a un'intestazione e al vuoto"
            fail=1
          else
            echo "  ok    senza testo la scheda non offre la pagina"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/lavori/senza-testo)
          [ "$code" = 404 ] \
            && echo "  ok    e la pagina risponde 404 anche se il lavoro esiste" \
            || { echo "::error::/lavori/senza-testo ha risposto $code con story vuota, atteso 404"; fail=1; }
          q "update works set story = 'Un paragrafo di prova.' where sort = 93"
          h2=$(curl -s http://127.0.0.1:4321/)
          grep -qF 'href="/lavori/senza-testo"' <<<"$h2" \
            && echo "  ok    scritto il testo, la scheda offre la pagina" \
            || { echo "::error::scritto il testo, la voce «Com'è fatto» non è comparsa"; fail=1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/lavori/senza-testo)
          [ "$code" = 200 ] \
            && echo "  ok    e la pagina risponde" \
            || { echo "::error::/lavori/senza-testo ha risposto $code con un testo, atteso 200"; fail=1; }
          # Un link scritto male nel pannello non deve finire in un href: è un
          # campo di testo, e «javascript:» sarebbe eseguibile.
          q "update works set links = E'Buono | https://esempio.example/\nCattivo | javascript:alert(1)\nSenza barra https://esempio.example/' where sort = 93"
          pag=$(curl -s http://127.0.0.1:4321/lavori/senza-testo)
          grep -qF 'https://esempio.example/' <<<"$pag" \
            && echo "  ok    il link buono compare" \
            || { echo "::error::il link valido non compare fra quelli da aprire"; fail=1; }
          if grep -qF 'javascript:' <<<"$pag"; then
            echo "::error::un link «javascript:» è finito in pagina"
            fail=1
          else
            echo "  ok    il link «javascript:» viene scartato"
          fi
          n_link=$(grep -o 'class="lp-link"' <<<"$pag" | wc -l)
          [ "$n_link" = 1 ] || { echo "::error::la sezione dei link da aprire non è stata resa"; fail=1; }

          q "delete from works where sort = 93"
          exit $fail

      # L'agenda. Le cose che devono valere sono tre: un orario non si prenota due
      # volte, non si prenota un orario che non è mai stato offerto, e chi ha
      # prenotato può disdire. Le prime due sono la ragione per cui esiste il
      # vincolo univoco sul database, la terza è la ragione per cui esiste il
      # codice nel link.
      - name: Un orario si prenota una volta sola
        run: |
          fail=0
          q() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -q -c "$1"; }
          qv() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -tA -c "$1"; }
          post() { curl -s -o "$1" -w '%{http_code}' -D "$1.head" -X POST "http://127.0.0.1:4321$2" -H 'Origin: http://127.0.0.1:4321' "${@:3}"; }

          # Le prenotazioni sono limitate a sei per quarto d'ora per indirizzo, e
          # qui ne partono quattro da 127.0.0.1: azzerare il conteggio all'inizio
          # evita che questa guardia fallisca per il proprio limite se viene
          # rieseguita, o se un giorno si aggiungono altri casi di prova.
          q "delete from rate_limits where rl_key like 'prenota:%'"

          # 1) Dopo le migrazioni l'agenda è SPENTA: la sezione contatti deve
          # ancora portare al link di prima, e la pagina deve dirlo invece di
          # mostrare un calendario vuoto.
          home=$(curl -s http://127.0.0.1:4321/)
          grep -qE 'href="https?://[^"]*"[^>]*class="contact-link contact-link-cal"' <<<"$home" \
            && echo "  ok    con l'agenda spenta il pulsante porta al link esterno" \
            || { echo "::error::agenda spenta, ma il pulsante non porta più al link esterno"; fail=1; }
          curl -s http://127.0.0.1:4321/prenota | grep -qF 'prenotazioni online sono chiuse' \
            && echo "  ok    e /prenota dice che è chiusa, con l'email come alternativa" \
            || { echo "::error::/prenota con l'agenda spenta non spiega che è chiusa"; fail=1; }
          curl -s http://127.0.0.1:4321/sitemap.xml | grep -qF '/prenota' \
            && { echo "::error::/prenota è nella sitemap con l'agenda spenta"; fail=1; } \
            || echo "  ok    e non è nella sitemap"

          # 2) Il feed del calendario non si apre senza la chiave giusta: dentro ci
          # sono nome ed email di chi ha prenotato.
          chiave=$(qv "select v from settings where k='agenda_ics_key'")
          [ -n "$chiave" ] || { echo "::error::la 010 non ha generato la chiave del feed"; fail=1; }
          for prova in "" "?k=" "?k=sbagliata" "?k=${chiave}x"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321/agenda.ics$prova")
            [ "$code" = 404 ] \
              && echo "  ok    il feed con «$prova» risponde 404" \
              || { echo "::error::/agenda.ics$prova ha risposto $code, atteso 404"; fail=1; }
          done
          tipo=$(curl -s -o /dev/null -w '%{content_type}' "http://127.0.0.1:4321/agenda.ics?k=$chiave")
          grep -q 'text/calendar' <<<"$tipo" \
            && echo "  ok    e con la chiave giusta serve un calendario" \
            || { echo "::error::il feed con la chiave giusta ha risposto $tipo"; fail=1; }

          # 3) Accesa: gli orari ci sono, sono link veri (senza JS si prenota
          # comunque) e la pagina non dipende da main.js per farsi vedere.
          q "update settings set v='1' where k='agenda_attiva'"
          pag=$(curl -s http://127.0.0.1:4321/prenota)
          # Solo i link della griglia: la scorciatoia al primo orario libero ha una
          # classe, e prenderla qui vorrebbe dire misurare due volte lo stesso slot.
          primo=$(grep -o '<a href="/prenota?slot=[^"]*"' <<<"$pag" | sed -n 1p | sed 's/.*slot=//;s/"//')
          if [ -z "$primo" ]; then
            echo "::error::agenda accesa ma nessun orario offerto: le fasce della 010 non producono slot"
            fail=1
          else
            echo "  ok    l'agenda offre orari, il primo è $primo"
          fi
          if grep -q 'class="[^"]*reveal' <<<"$pag"; then
            echo "::error::/prenota usa .reveal, ma qui main.js non gira: resterebbe vuota"
            fail=1
          else
            echo "  ok    /prenota non dipende da main.js"
          fi
          grep -qF 'href="/prenota"' <<<"$(curl -s http://127.0.0.1:4321/)" \
            && echo "  ok    e il pulsante in home resta dentro il sito" \
            || { echo "::error::agenda accesa, ma il pulsante in home non porta a /prenota"; fail=1; }
          curl -s http://127.0.0.1:4321/sitemap.xml | grep -qF '/prenota' \
            && echo "  ok    /prenota è nella sitemap" \
            || { echo "::error::/prenota non è nella sitemap con l'agenda accesa"; fail=1; }

          slot=$(printf '%b' "${primo//%/\\x}")

          # 4) Si prenota, e l'orario sparisce dall'elenco.
          code=$(post /tmp/pren1.html /prenota --data-urlencode "slot=$slot" \
            --data-urlencode 'name=Prova CI' --data-urlencode 'email=prova@esempio.example' \
            --data-urlencode 'note=Riga di prova.')
          token=$(grep -i '^location:' /tmp/pren1.html.head | sed 's|.*/prenota/||' | tr -d '\r')
          if [ "$code" = 303 ] && [ -n "$token" ]; then
            echo "  ok    la prenotazione risponde 303 verso la scheda dell'appuntamento"
          else
            echo "::error::la prenotazione ha risposto $code (location «$token»), atteso un 303"
            fail=1
          fi
          scheda=$(curl -s "http://127.0.0.1:4321/prenota/$token")
          grep -qF 'Prova CI' <<<"$scheda" \
            && echo "  ok    la scheda mostra l'appuntamento" \
            || { echo "::error::la scheda dell'appuntamento non mostra il nome"; fail=1; }
          grep -qF 'name="robots" content="noindex"' <<<"$scheda" \
            && echo "  ok    e non finisce nei motori di ricerca" \
            || { echo "::error::la scheda dell'appuntamento non è noindex"; fail=1; }
          curl -s http://127.0.0.1:4321/prenota | grep -qF "$primo" \
            && { echo "::error::l'orario prenotato è ancora nell'elenco"; fail=1; } \
            || echo "  ok    l'orario prenotato non è più offerto"

          # 5) Lo stesso orario, una seconda volta: nessuna riga in più.
          post /tmp/pren2.html /prenota --data-urlencode "slot=$slot" \
            --data-urlencode 'name=Doppione CI' --data-urlencode 'email=doppio@esempio.example' >/dev/null
          n=$(qv "select count(*) from appointments where starts_at = '$slot' and status = 'confermato'")
          [ "$n" = 1 ] \
            && echo "  ok    lo stesso orario resta prenotato una volta sola" \
            || { echo "::error::$n appuntamenti confermati sullo stesso istante"; fail=1; }
          grep -qF 'Doppione CI' <<<"$(qv "select coalesce(string_agg(name,','),'') from appointments")" \
            && { echo "::error::il doppione è stato scritto comunque"; fail=1; } \
            || echo "  ok    e il secondo non è finito a database"

          # 5-bis) Il vincolo va provato dove vive, cioè nel database: due
          # richieste HTTP in fila non si sovrappongono mai, quindi il controllo
          # applicativo le respinge da sé e questa guardia passerebbe anche senza
          # l'indice univoco. Il caso vero è due persone che premono nello stesso
          # istante, e in SQL si riproduce.
          q "insert into appointments (name, email, starts_at, minutes, token)
             values ('Vincolo A', 'a@esempio.example', '2035-06-04T09:00:00Z', 30, repeat('a', 32))"
          q "insert into appointments (name, email, starts_at, minutes, token)
             values ('Vincolo B', 'b@esempio.example', '2035-06-04T09:00:00Z', 30, repeat('b', 32))" 2>/dev/null || true
          n=$(qv "select count(*) from appointments where starts_at = '2035-06-04T09:00:00Z' and status = 'confermato'")
          [ "$n" = 1 ] \
            && echo "  ok    il database rifiuta il secondo confermato sullo stesso istante" \
            || { echo "::error::$n confermati sullo stesso istante: manca il vincolo univoco"; fail=1; }
          # E disdicendo il primo, l'istante torna disponibile anche per il vincolo:
          # altrimenti una disdetta non libererebbe niente.
          q "update appointments set status = 'disdetto' where token = repeat('a', 32)"
          q "insert into appointments (name, email, starts_at, minutes, token)
             values ('Vincolo C', 'c@esempio.example', '2035-06-04T09:00:00Z', 30, repeat('c', 32))" 2>/dev/null || true
          n=$(qv "select count(*) from appointments where starts_at = '2035-06-04T09:00:00Z' and status = 'confermato'")
          [ "$n" = 1 ] \
            && echo "  ok    e dopo una disdetta lo stesso istante si può riprendere" \
            || { echo "::error::dopo la disdetta i confermati su quell'istante sono $n"; fail=1; }
          q "delete from appointments where starts_at = '2035-06-04T09:00:00Z'"

          # 6) Un orario mai offerto non si prenota, nemmeno scrivendolo a mano nel
          # campo nascosto: è il caso delle tre di notte di un giorno qualsiasi.
          post /tmp/pren3.html /prenota --data-urlencode 'slot=2035-01-02T02:00:00.000Z' \
            --data-urlencode 'name=Notturno CI' --data-urlencode 'email=notte@esempio.example' >/dev/null
          n=$(qv "select count(*) from appointments where starts_at = '2035-01-02T02:00:00Z'")
          [ "$n" = 0 ] \
            && echo "  ok    un orario fuori dalle fasce viene rifiutato" \
            || { echo "::error::è stato prenotato un orario che non era offerto"; fail=1; }

          # 7) Un giorno chiuso vince sulle fasce.
          giorno=$(qv "select to_char((now() + interval '3 days')::date, 'YYYY-MM-DD')")
          q "insert into agenda_closures (day, reason, sort) values ('$giorno', 'Prova CI', 99)"
          n=$(curl -s http://127.0.0.1:4321/prenota | grep -o "slot=$giorno" | wc -l)
          [ "$n" = 0 ] \
            && echo "  ok    un giorno chiuso non offre nessun orario" \
            || { echo "::error::il giorno chiuso $giorno offre ancora $n orari"; fail=1; }
          q "delete from agenda_closures where sort = 99"

          # 8) Chi ha prenotato può disdire, e l'orario torna libero. La riga resta:
          # «avevo prenotato» è una domanda a cui serve poter rispondere.
          post /tmp/dis.html "/prenota/$token" --data-urlencode 'azione=disdici' >/dev/null
          stato=$(qv "select status from appointments where token = '$token'")
          [ "$stato" = disdetto ] \
            && echo "  ok    la disdetta cambia lo stato senza cancellare la riga" \
            || { echo "::error::dopo la disdetta lo stato è «$stato»"; fail=1; }
          curl -s http://127.0.0.1:4321/prenota | grep -qF "$primo" \
            && echo "  ok    e l'orario torna disponibile" \
            || { echo "::error::l'orario disdetto non è tornato nell'elenco"; fail=1; }

          # 9) Il file per il calendario: quello dell'appuntamento e quello inventato.
          q "update appointments set status = 'confermato' where token = '$token'"
          tipo=$(curl -s -o /tmp/app.ics -w '%{content_type}' "http://127.0.0.1:4321/prenota/$token.ics")
          grep -q 'text/calendar' <<<"$tipo" \
            && echo "  ok    l'appuntamento si scarica come calendario" \
            || { echo "::error::il .ics dell'appuntamento ha risposto $tipo"; fail=1; }
          for atteso in BEGIN:VCALENDAR DTSTART: DTEND: END:VCALENDAR; do
            grep -qF "$atteso" /tmp/app.ics || { echo "::error::il .ics non contiene $atteso"; fail=1; }
          done
          # Le righe di un .ics finiscono con CRLF: senza, i calendari più severi
          # rifiutano il file.
          grep -qU $'\r' /tmp/app.ics \
            && echo "  ok    e le sue righe finiscono con CRLF" \
            || { echo "::error::il .ics non usa CRLF"; fail=1; }
          for finto in ffffffffffffffffffffffffffffffff corto; do
            for coda in "" ".ics"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321/prenota/$finto$coda")
              [ "$code" = 404 ] \
                && echo "  ok    /prenota/$finto$coda risponde 404" \
                || { echo "::error::/prenota/$finto$coda ha risposto $code, atteso 404"; fail=1; }
            done
          done

          # 10) La pausa fra due call: gli orari devono distare durata + pausa, e un
          # appuntamento deve occupare anche la pausa che gli sta intorno.
          durata=$(qv "select v from settings where k='agenda_minuti'")
          pausa=$(qv "select v from settings where k='agenda_pausa'")
          passo=$((durata + pausa))
          primi=$(curl -s http://127.0.0.1:4321/prenota | grep -o '<a href="/prenota?slot=[^"]*"' | sed 's/.*slot=//;s/"//' | head -2)
          a=$(echo "$primi" | sed -n 1p); b=$(echo "$primi" | sed -n 2p)
          # I due orari possono stare in fasce diverse (mattina/pomeriggio): il
          # confronto vale solo se distano meno di due ore.
          diff=$(qv "select round(extract(epoch from (timestamptz '$(printf '%b' "${b//%/\\x}")' - timestamptz '$(printf '%b' "${a//%/\\x}")')) / 60)")
          if [ "$diff" -le 120 ] && [ "$diff" != "$passo" ]; then
            echo "::error::i primi due orari distano $diff minuti, attesi $passo (durata $durata + pausa $pausa)"
            fail=1
          else
            echo "  ok    gli orari distano $passo minuti, cioè durata più pausa"
          fi

          # 11) Un blocco parziale toglie solo le sue ore, non il giorno.
          giorno2=$(qv "select to_char((now() + interval '4 days')::date, 'YYYY-MM-DD')")
          prima_del_blocco=$(curl -s http://127.0.0.1:4321/prenota | grep -o "slot=$giorno2[^\"]*" | wc -l)
          q "insert into agenda_closures (day, from_time, to_time, reason, sort) values ('$giorno2', '09:00', '11:00', 'Prova CI', 98)"
          dopo_il_blocco=$(curl -s http://127.0.0.1:4321/prenota | grep -o "slot=$giorno2[^\"]*" | wc -l)
          if [ "$prima_del_blocco" -gt 0 ] && [ "$dopo_il_blocco" -gt 0 ] && [ "$dopo_il_blocco" -lt "$prima_del_blocco" ]; then
            echo "  ok    il blocco parziale toglie qualche orario ($prima_del_blocco → $dopo_il_blocco) e lascia il resto"
          else
            echo "::error::blocco parziale su $giorno2: orari $prima_del_blocco → $dopo_il_blocco, atteso un calo che non azzera"
            fail=1
          fi
          # E senza orari, la stessa riga chiude il giorno intero: è la differenza
          # fra le ferie e un impegno di mezz'ora.
          q "update agenda_closures set from_time = '', to_time = '' where sort = 98"
          n=$(curl -s http://127.0.0.1:4321/prenota | grep -o "slot=$giorno2" | wc -l)
          [ "$n" = 0 ] \
            && echo "  ok    senza orari la stessa riga chiude tutto il giorno" \
            || { echo "::error::chiusura senza orari: $giorno2 offre ancora $n orari"; fail=1; }
          # Un orario illeggibile vale come «tutto il giorno»: fra chiudere troppo e
          # prenotare sopra un impegno che c'era già, il primo costa meno.
          q "update agenda_closures set from_time = 'mattina', to_time = 'pranzo' where sort = 98"
          n=$(curl -s http://127.0.0.1:4321/prenota | grep -o "slot=$giorno2" | wc -l)
          [ "$n" = 0 ] \
            && echo "  ok    e un orario che non si legge chiude il giorno, invece di aprirlo" \
            || { echo "::error::chiusura con orario illeggibile: $giorno2 offre ancora $n orari"; fail=1; }
          q "delete from agenda_closures where sort = 98"

          # 12) Spostare: un solo passaggio, e quello vecchio resta valido se il
          # nuovo non è libero. Cambia anche la revisione, che è ciò che dice ai
          # calendari «l'evento che hai già è cambiato».
          pag=$(curl -s http://127.0.0.1:4321/prenota)
          primo=$(grep -o '<a href="/prenota?slot=[^"]*"' <<<"$pag" | sed -n 1p | sed 's/.*slot=//;s/"//')
          secondo=$(grep -o '<a href="/prenota?slot=[^"]*"' <<<"$pag" | sed -n 2p | sed 's/.*slot=//;s/"//')
          slot1=$(printf '%b' "${primo//%/\\x}"); slot2=$(printf '%b' "${secondo//%/\\x}")
          post /tmp/sp1.html /prenota --data-urlencode "slot=$slot1" \
            --data-urlencode 'name=Sposta CI' --data-urlencode 'email=sposta@esempio.example' >/dev/null
          tk=$(grep -i '^location:' /tmp/sp1.html.head | sed 's|.*/prenota/||' | tr -d '\r')
          grep -qF 'Sposta a un altro orario' <<<"$(curl -s "http://127.0.0.1:4321/prenota/$tk")" \
            && echo "  ok    la scheda offre lo spostamento" \
            || { echo "::error::la scheda non offre lo spostamento"; fail=1; }
          # Gli orari per spostare sono pulsanti di un form, non link: un GET che
          # modifica lo eseguono i precaricamenti del browser.
          elenco=$(curl -s "http://127.0.0.1:4321/prenota/$tk?sposta=1")
          grep -qF 'Scegli il nuovo orario' <<<"$elenco" \
            && echo "  ok    e mostra gli orari liberi" \
            || { echo "::error::l'elenco per spostare non compare"; fail=1; }
          if grep -qE "href=\"/prenota/$tk\?sposta=1&(amp;)?slot=" <<<"$elenco"; then
            echo "::error::gli orari per spostare sono link: un GET non deve cambiare i dati"
            fail=1
          else
            echo "  ok    e sono pulsanti di un form, non link"
          fi
          # Il promemoria si segna prima dello spostamento, altrimenti il controllo
          # qui sotto passerebbe da sé: reminded_at sarebbe nullo comunque, e non
          # si vedrebbe la differenza fra «azzerato» e «mai scritto».
          q "update appointments set reminded_at = now() where token = '$tk'"
          post /tmp/sp2.html "/prenota/$tk" --data-urlencode 'azione=sposta' --data-urlencode "slot=$slot2" >/dev/null
          letto=$(qv "select to_char(starts_at, 'YYYY-MM-DD\"T\"HH24:MI:SSOF') || '|' || version || '|' || coalesce(reminded_at::text, 'nullo') from appointments where token = '$tk'")
          if grep -q '|1|nullo' <<<"$letto"; then
            echo "  ok    lo spostamento alza la revisione e azzera il promemoria"
          else
            echo "::error::dopo lo spostamento la riga dice «$letto», attesi revisione 1 e promemoria nullo"
            fail=1
          fi
          grep -qF 'SEQUENCE:1' <<<"$(curl -s "http://127.0.0.1:4321/prenota/$tk.ics")" \
            && echo "  ok    e il .ics porta SEQUENCE:1, così i calendari aggiornano l'evento" \
            || { echo "::error::il .ics dopo lo spostamento non porta SEQUENCE:1"; fail=1; }
          # Spostare su un orario che non esiste non deve toccare quello valido.
          quando_prima=$(qv "select starts_at from appointments where token = '$tk'")
          post /tmp/sp3.html "/prenota/$tk" --data-urlencode 'azione=sposta' --data-urlencode 'slot=2035-01-02T02:00:00.000Z' >/dev/null
          quando_dopo=$(qv "select starts_at from appointments where token = '$tk'")
          [ "$quando_prima" = "$quando_dopo" ] \
            && echo "  ok    uno spostamento verso un orario mai offerto non tocca l'appuntamento" \
            || { echo "::error::l'appuntamento è stato spostato su un orario non offerto"; fail=1; }

          # 13) Due appuntamenti non si sovrappongono nemmeno con durate diverse:
          # è il vincolo stretto dalla 011, e vale dove vive.
          base=$(qv "select to_char(date_trunc('hour', now()) + interval '30 days', 'YYYY-MM-DD\"T\"HH24:MI:SSOF')")
          q "insert into appointments (name, email, starts_at, minutes, token)
             values ('Lungo CI', 'l@esempio.example', '$base', 90, repeat('e', 32))"
          q "insert into appointments (name, email, starts_at, minutes, token)
             values ('Dentro CI', 'd@esempio.example', timestamptz '$base' + interval '30 minutes', 30, repeat('f', 32))" 2>/dev/null || true
          n=$(qv "select count(*) from appointments where token in (repeat('e', 32), repeat('f', 32))")
          [ "$n" = 1 ] \
            && echo "  ok    un appuntamento dentro un altro più lungo viene rifiutato" \
            || { echo "::error::$n appuntamenti accavallati accettati: il vincolo della 011 non c'è"; fail=1; }
          # E la fine viene tenuta allineata dal database, non da chi scrive.
          fine=$(qv "select ends_at = starts_at + interval '1 minute' * minutes from appointments where token = repeat('e', 32)")
          [ "$fine" = t ] \
            && echo "  ok    e la fine dell'appuntamento la calcola il database" \
            || { echo "::error::ends_at non corrisponde a starts_at + durata"; fail=1; }
          q "update appointments set minutes = 15 where token = repeat('e', 32)"
          fine=$(qv "select ends_at = starts_at + interval '15 minutes' from appointments where token = repeat('e', 32)")
          [ "$fine" = t ] \
            && echo "  ok    anche dopo un cambio di durata" \
            || { echo "::error::cambiata la durata, ends_at è rimasto quello di prima"; fail=1; }

          # 14) Il promemoria: si scelgono solo gli appuntamenti dentro la finestra
          # che NON sono stati prenotati dentro la finestra stessa — per chi prenota
          # per domani, la conferma è già il promemoria.
          q "delete from appointments"
          q "insert into appointments (name, email, starts_at, minutes, token, created_at) values
               ('Da avvisare CI',    'a@esempio.example', date_trunc('hour', now()) + interval '20 hours', 30, repeat('1', 32), now() - interval '3 days'),
               ('Troppo lontano CI', 'b@esempio.example', date_trunc('hour', now()) + interval '40 hours', 30, repeat('2', 32), now() - interval '3 days'),
               ('Prenotato ora CI',  'c@esempio.example', date_trunc('hour', now()) + interval '5 hours',  30, repeat('3', 32), now()),
               ('Già avvisato CI',   'd@esempio.example', date_trunc('hour', now()) + interval '10 hours', 30, repeat('4', 32), now() - interval '3 days')"
          q "update appointments set reminded_at = now() where token = repeat('4', 32)"
          scelti=$(qv "select coalesce(string_agg(name, ',' order by starts_at), '') from appointments
                        where status = 'confermato' and reminded_at is null and starts_at > now()
                          and starts_at <= now() + make_interval(hours => 24)
                          and created_at < starts_at - make_interval(hours => 24)")
          [ "$scelti" = 'Da avvisare CI' ] \
            && echo "  ok    il promemoria sceglie solo chi ha prenotato prima della finestra" \
            || { echo "::error::il promemoria avrebbe scelto «$scelti», atteso solo «Da avvisare CI»"; fail=1; }

          # 15) Le parti che invitano a prenotare. Non sono decorazione: la
          # scorciatoia al primo orario è ciò che preme chi vuole parlare presto, il
          # riepilogo dice cosa si sta confermando senza tornare indietro, e i tre
          # passaggi sulla conferma rispondono a «e adesso?». Se sparissero, la
          # pagina tornerebbe un elenco di orari senza che nessuno se ne accorga.
          pag=$(curl -s http://127.0.0.1:4321/prenota)
          scorciatoia=$(grep -o 'class="pr-primo" href="[^"]*"' <<<"$pag" | sed 's/.*href="//;s/"//')
          if [ -n "$scorciatoia" ]; then
            echo "  ok    c'è la scorciatoia al primo orario libero"
          else
            echo "::error::manca la scorciatoia al primo orario libero"
            fail=1
          fi
          grep -qF 'class="pr-perche"' <<<"$pag" \
            && echo "  ok    e le tre cose che dicono com'è la call" \
            || { echo "::error::mancano le rassicurazioni sopra gli orari"; fail=1; }
          # La scorciatoia deve portare al passaggio dei dati, con il riepilogo di
          # cosa si sta confermando.
          passo2=$(curl -s "http://127.0.0.1:4321${scorciatoia//&amp;/&}")
          grep -qF 'class="pr-scelto"' <<<"$passo2" \
            && echo "  ok    la scorciatoia porta al form, con l'orario in riepilogo" \
            || { echo "::error::dalla scorciatoia non si arriva al riepilogo dell'orario scelto"; fail=1; }
          grep -qE 'name="slot" value="[^"]+"' <<<"$passo2" \
            && echo "  ok    e il form porta con sé l'orario" \
            || { echo "::error::il form del passaggio due non porta l'orario"; fail=1; }
          # E la conferma dice cosa succede adesso.
          q "delete from appointments"
          q "delete from rate_limits where rl_key like 'prenota:%'"
          slotp=$(printf '%b' "$(sed 's/.*slot=//' <<<"${scorciatoia//&amp;/&}" | sed 's/%/\\x/g')")
          post /tmp/inv.html /prenota --data-urlencode "slot=$slotp" \
            --data-urlencode 'name=Invito CI' --data-urlencode 'email=invito@esempio.example' >/dev/null
          tki=$(grep -i '^location:' /tmp/inv.html.head | sed 's|.*/prenota/||' | tr -d '\r')
          grep -qF 'class="pr-dopo"' <<<"$(curl -s "http://127.0.0.1:4321/prenota/$tki")" \
            && echo "  ok    e la conferma spiega cosa succede adesso" \
            || { echo "::error::la pagina di conferma non spiega i passaggi successivi"; fail=1; }

          # Si rimette tutto come l'hanno trovato le migrazioni.
          q "delete from appointments"
          q "update settings set v='' where k='agenda_attiva'"
          exit $fail

      # I dati strutturati. La regola non è tecnica: non si dichiara un dato che
      # nessuno ha scritto. Un indirizzo o un telefono inventati non sono
      # un'imprecisione da correggere dopo — Google li confronta con la scheda
      # dell'attività, e se non combaciano il segnale non vale; se combaciano ma
      # sono falsi, il problema non è più il posizionamento.
      - name: I dati strutturati dicono solo quello che c'è
        run: |
          fail=0
          q() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -q -c "$1"; }
          # Il blocco JSON-LD della home. Si estrae con grep e non con un parser
          # perché serve solo cercarci dentro: le chiavi mancanti sono il punto.
          leggi() {
            curl -s http://127.0.0.1:4321/ | tr -d '\n' \
              | grep -o '<script type="application/ld+json"[^>]*>[^<]*</script>' \
              | sed 's/.*json"[^>]*>//; s|</script>||'
          }

          # 1) A campi vuoti — come li lascia la 012 — nessun dato locale.
          dati=$(leggi)
          [ -n "$dati" ] || { echo "::error::nessun blocco JSON-LD nella home"; fail=1; }
          for vietato in telephone address geo vatID sameAs hasMap; do
            if grep -q "\"$vietato\"" <<<"$dati"; then
              echo "::error::con le impostazioni vuote la pagina dichiara «$vietato»: è un dato che nessuno ha scritto"
              fail=1
            else
              echo "  ok    niente «$vietato» finché il campo è vuoto"
            fi
          done
          grep -q 'ProfessionalService' <<<"$dati" \
            && echo "  ok    l'attività è dichiarata comunque, con quello che si può dimostrare" \
            || { echo "::error::manca l'oggetto dell'attività nei dati strutturati"; fail=1; }
          grep -q 'FAQPage' <<<"$dati" \
            && echo "  ok    e le FAQ, che sono vere e stanno nel database" \
            || { echo "::error::le FAQ non sono dichiarate come FAQPage"; fail=1; }
          # Le domande dichiarate devono essere quelle in pagina: un FAQPage con
          # domande che il visitatore non trova viene trattato come una bugia.
          n_json=$(grep -o '"Question"' <<<"$dati" | wc -l)
          n_pagina=$(curl -s http://127.0.0.1:4321/ | grep -o 'class="faq-item' | wc -l)
          if [ "$n_json" = "$n_pagina" ] && [ "$n_json" -gt 0 ]; then
            echo "  ok    le $n_json domande dichiarate sono quelle rese in pagina"
          else
            echo "::error::domande nei dati strutturati: $n_json, domande in pagina: $n_pagina"
            fail=1
          fi

          # 2) Compilati i campi, i dati compaiono — e con i valori scritti.
          q "update settings set v='Sarzana' where k='biz_city'"
          q "update settings set v='SP' where k='biz_province'"
          q "update settings set v='+39 333 1234567' where k='biz_phone'"
          q "update settings set v='La Spezia, Massa-Carrara' where k='biz_zone'"
          q "update settings set v='https://www.linkedin.com/in/esempio' where k='social_linkedin'"
          q "update settings set v='javascript:alert(1)' where k='social_github'"
          dati=$(leggi)
          grep -qF '+39 333 1234567' <<<"$dati" \
            && echo "  ok    il telefono compare quando è scritto" \
            || { echo "::error::il telefono scritto non compare nei dati strutturati"; fail=1; }
          grep -qF 'Sarzana' <<<"$dati" \
            && echo "  ok    la città compare come località" \
            || { echo "::error::la città non compare nell'indirizzo"; fail=1; }
          # Senza via non deve comparire streetAddress: per un'attività senza sede
          # dichiarare un indirizzo postale sarebbe falso.
          if grep -q 'streetAddress' <<<"$dati"; then
            echo "::error::compare streetAddress senza che nessuno abbia scritto la via"
            fail=1
          else
            echo "  ok    e senza via non si dichiara nessun indirizzo postale"
          fi
          grep -qF 'La Spezia' <<<"$dati" \
            && echo "  ok    le zone servite sostituiscono «Italia»" \
            || { echo "::error::le zone servite non compaiono in areaServed"; fail=1; }
          curl -s http://127.0.0.1:4321/ | grep -qF 'Lavoro con clienti in' \
            && echo "  ok    e sono scritte anche per chi legge, non solo per i motori" \
            || { echo "::error::le zone sono dichiarate ai motori ma non ai visitatori"; fail=1; }
          # Un profilo con uno schema non web viene scartato: quel valore finisce
          # in sameAs e potrebbe finire in un href.
          if grep -q 'javascript:' <<<"$dati"; then
            echo "::error::un indirizzo «javascript:» è finito nei dati strutturati"
            fail=1
          else
            echo "  ok    un profilo con schema non web viene scartato"
          fi
          # Coordinate illeggibili: nessun punto sulla mappa, invece di uno sbagliato.
          q "update settings set v='mezzogiorno' where k='biz_lat'"
          q "update settings set v='9.9' where k='biz_lng'"
          if grep -q 'GeoCoordinates' <<<"$(leggi)"; then
            echo "::error::coordinate non numeriche accettate: l'attività finirebbe in mezzo al mare"
            fail=1
          else
            echo "  ok    coordinate illeggibili non producono un punto sulla mappa"
          fi

          # 3) L'anteprima social: c'era il logo verticale, che ogni piattaforma
          # ritagliava a modo suo.
          tipo=$(curl -s -o /tmp/og.png -w '%{content_type}' http://127.0.0.1:4321/assets/og.png)
          grep -q 'image/png' <<<"$tipo" \
            && echo "  ok    l'immagine social c'è" \
            || { echo "::error::/assets/og.png ha risposto $tipo"; fail=1; }
          if file /tmp/og.png | grep -q '1200 x 630'; then
            echo "  ok    ed è 1200x630, la misura che le piattaforme non ritagliano"
          else
            echo "::error::l'immagine social non è 1200x630: $(file -b /tmp/og.png)"
            fail=1
          fi
          home=$(curl -s http://127.0.0.1:4321/)
          for atteso in 'og:site_name' 'og:image:width' 'twitter:image' 'assets/og.png'; do
            grep -qF "$atteso" <<<"$home" \
              && echo "  ok    c'è $atteso" \
              || { echo "::error::manca $atteso"; fail=1; }
          done

          q "update settings set v='' where k in ('biz_city','biz_province','biz_phone','biz_zone','social_linkedin','social_github','biz_lat','biz_lng')"
          exit $fail

      # Le quattro cose che si vedono, e le tre trappole che nascondono.
      - name: Indice, cuciture, titoli e domande
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0

          # 1) L'indice del bordo destro deve avere un trattino per OGNI sezione
          # resa, e nessun trattino in più: un'ancora che porta al nulla è peggio
          # di una voce mancante. Le recensioni ci sono solo se sono vere, quindi
          # il conto va fatto sull'HTML servito, non su una lista scritta a mano.
          for id in $(grep -o 'data-sez="[^"]*"' <<<"$html" | sed 's/data-sez="//;s/"//'); do
            if grep -qE "id=\"$id\"" <<<"$html"; then echo "  ok    l'indice punta a #$id, che esiste"
            else echo "::error::l'indice ha un trattino per #$id, che non è in pagina"; fail=1; fi
          done
          n_tratti=$(grep -o 'data-sez="' <<<"$html" | wc -l)
          [ "$n_tratti" -ge 8 ] || { echo "::error::solo $n_tratti trattini nell'indice: manca qualche sezione"; fail=1; }
          # E i link devono essere veri <a>: senza JS l'indice deve restare
          # navigabile, non diventare un ornamento inerte.
          if grep -qE '<nav class="indice"[^>]*>.*<a href="#' <<<"$(tr -d '\n' <<<"$html")"; then
            echo "  ok    i trattini sono link, funzionano senza JS"
          else
            echo "::error::l'indice non contiene <a href=\"#…\">: senza JS non porterebbe da nessuna parte"
            fail=1
          fi

          # 2) La cucitura di sezione parte VISIBILE e la nasconde solo .js: se lo
          # stato di partenza fosse scaleX(0) senza condizione, chi non ha JS
          # vedrebbe una pagina senza nessuna linea, per sempre. È lo stesso
          # errore che era già stato fatto con .reveal.
          # Il CSS è indentato su più righe: la regola va letta su una riga sola,
          # altrimenti la ricerca non trova mai il valore dentro il blocco.
          css=$(tr '\n' ' ' < public/css/style.css)
          if grep -qE '\.section::before\{[^}]*transform:scaleX\(1\)' <<<"$css"; then
            echo "  ok    la cucitura è visibile senza JS"
          else
            echo "::error::.section::before non parte da scaleX(1): senza JS le cuciture non comparirebbero mai"
            fail=1
          fi
          grep -qE '\.js \.section::before\{[^}]*scaleX\(0\)' <<<"$css" \
            && echo "  ok    ed è nascosta solo sotto .js" \
            || { echo "::error::manca la regola .js .section::before che la nasconde prima dell'ingresso"; fail=1; }

          # 3) I titoli NON devono essere spezzati in parole. Sembra un
          # miglioramento e rompe la traduzione: i18n.js raccoglie i nodi di testo
          # una volta sola, e tre nodi da una parola non corrispondono più a
          # nessuna chiave del dizionario. Quel titolo resterebbe italiano per
          # sempre, e non si ripara nemmeno cambiando lingua due volte.
          if grep -qE "querySelectorAll\('[^']*h2'\)[^;]*(split\(' '\)|innerHTML)" public/js/main.js; then
            echo "::error::qualcosa spezza i titoli in parole: rompe il dizionario inglese"
            fail=1
          else
            echo "  ok    nessuno spezza i titoli in nodi di testo separati"
          fi
          grep -q '@property --passata' public/css/style.css \
            && echo "  ok    la passata del titolo è dichiarata come proprietà animabile" \
            || { echo "::error::manca @property --passata: senza, la maschera del titolo non si anima e resta ferma a 0%"; fail=1; }

          # 4) Le domande si animano su ::details-content. Il trucco della griglia
          # 0fr→1fr NON funziona su <details> — provato e misurato, altezza
          # identica aperta e chiusa — quindi se ricomparisse sarebbe un ritorno a
          # un'animazione che non c'è.
          if grep -q '::details-content' public/css/style.css; then
            echo "  ok    l'altezza delle domande si anima su ::details-content"
          else
            echo "::error::manca la regola su ::details-content: le risposte tornerebbero ad aprirsi di scatto"
            fail=1
          fi
          if grep -qE '\.faq-item[^{]*\{[^}]*grid-template-rows:0fr' public/css/style.css; then
            echo "::error::è tornato il trucco 0fr→1fr sulle domande: su <details> non anima niente"
            fail=1
          fi

          # 5) Il testo del pulsante d'invio non va scritto dal JavaScript:
          # sostituisce il nodo raccolto dal dizionario e da quel momento il
          # pulsante resta nella lingua in cui era. Le due etichette stanno nel
          # markup e il CSS scambia quale si vede.
          if grep -qE '(btn|submitTesto|testo)\.textContent *=' public/js/main.js; then
            echo "::error::il JS scrive di nuovo l'etichetta del pulsante: dopo il primo invio non si tradurrebbe più"
            fail=1
          else
            echo "  ok    l'etichetta del pulsante non viene riscritta dal JS"
          fi
          for eti in 'class="btn-testo"' 'class="btn-attesa"'; do
            grep -qF "$eti" <<<"$html" || { echo "::error::manca $eti nel pulsante d'invio"; fail=1; }
          done
          exit $fail

      # Il preventivo si porta via come link (#p=tipo+funzione+funzione), e le
      # chiavi che lo compongono le scrive il server negli attributi data-k.
      # Prima l'aggancio fra hero e configuratore era sul TESTO dei pulsanti: con
      # il sito in inglese le etichette sono tradotte, il confronto non trovava
      # niente, e scegliere il tipo di progetto nell'hero non faceva nulla. Era
      # rotto in produzione e nessun controllo lo vedeva. Questo lo vede.
      - name: Il preventivo si può mandare, e l'hero muove il configuratore
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          estrai() { grep -o "$1" <<<"$html" | grep -o 'data-k="[^"]*"' | sed 's/data-k="//;s/"//' | sort; }
          tipi=$(estrai 'class="cfg-type[^>]*data-k="[^"]*"')
          eroe=$(estrai 'class="hero-tipo[^>]*data-k="[^"]*"')
          extra=$(grep -o '<input[^>]*data-k="[^"]*"' <<<"$html" | grep -o 'data-k="[^"]*"' | sed 's/data-k="//;s/"//' | sort)

          for coppia in "tipi:$tipi" "extra:$extra"; do
            nome=${coppia%%:*}; lista=${coppia#*:}
            n=$(grep -c . <<<"$lista" || true)
            u=$(sort -u <<<"$lista" | grep -c . || true)
            if [ "$n" = 0 ]; then echo "::error::nessuna chiave data-k fra i $nome"; fail=1
            elif [ "$n" != "$u" ]; then echo "::error::chiavi data-k ripetute fra i $nome: due voci finirebbero nello stesso link"; fail=1
            else echo "  ok    $n chiavi $nome, tutte diverse"; fi
          done

          # Le due liste devono coincidere: sono lo stesso listino mostrato due
          # volte, e l'aggancio fra l'hero e il configuratore è proprio questo.
          if [ "$tipi" = "$eroe" ]; then
            echo "  ok    hero e configuratore condividono le stesse chiavi"
          else
            echo "::error::le chiavi dell'hero e del configuratore non coincidono: scegliere in cima non muoverebbe il configuratore"
            echo "  hero:          $(tr '\n' ' ' <<<"$eroe")"
            echo "  configuratore: $(tr '\n' ' ' <<<"$tipi")"
            fail=1
          fi

          # E l'aggancio non deve tornare a basarsi sul testo mostrato, che è
          # tradotto: è esattamente il difetto che era in produzione.
          if grep -qE "textContent(\.trim\(\))? === .*dataset\.label" public/js/main.js; then
            echo "::error::l'aggancio hero/configuratore confronta di nuovo il testo con l'etichetta: si rompe in inglese"
            fail=1
          else
            echo "  ok    l'aggancio non passa dal testo mostrato"
          fi

          # Il pulsante di copia nasce nascosto: senza JS non potrebbe copiare
          # niente, e un pulsante che non fa nulla è peggio di uno che non c'è.
          if grep -qE '<button[^>]*id="cfgLink"[^>]*hidden' <<<"$html"; then
            echo "  ok    il pulsante di copia nasce nascosto"
          else
            echo "::error::il pulsante «copia il link» non è hidden nell'HTML servito: senza JS resterebbe visibile e inerte"
            fail=1
          fi
          # E l'attributo hidden deve vincere davvero. Non basta scriverlo nel
          # markup: è una regola del browser, e .cfg-link{display:block} la
          # annullava — il pulsante era hidden e si vedeva comunque. Il primo
          # controllo qui sopra passava mentre la pagina era rotta; questo guarda
          # la cosa che conta.
          if grep -qE '^\[hidden\]\{display:none!important\}' public/css/style.css; then
            echo "  ok    [hidden] vince su qualunque regola d'autore"
          else
            echo "::error::manca [hidden]{display:none!important} nel reset: qualsiasi display:block su un elemento hidden lo rende visibile"
            fail=1
          fi
          exit $fail

      # About e «Perché Dext Lab» erano due sezioni che dicevano la stessa cosa, e
      # la seconda la diceva con una tabella che affermava cose su agenzie e
      # freelance senza poterle provare. Ora è una sezione sola con quattro
      # impegni verificabili. Le tre trappole che questo controllo copre: la
      # tabella che torna, la sezione che si sdoppia di nuovo, e il numero scritto
      # nella frase che non corrisponde più agli impegni elencati.
      - name: Una sola sezione dice perché scegliermi
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          for morto in 'class="compare' 'class="about-list' 'id="about"' 'Freelance classico'; do
            if grep -qF "$morto" <<<"$html"; then
              echo "::error::è tornato $morto: la sezione doppia era stata fusa"
              fail=1
            else
              echo "  ok    niente $morto"
            fi
          done
          for vivo in 'id="perche"' 'class="about-visual' 'class="about-text' 'class="impegni'; do
            grep -qF "$vivo" <<<"$html" || { echo "::error::manca $vivo nella sezione fusa"; fail=1; }
          done
          # Il numero nella frase e gli impegni elencati devono coincidere: la
          # frase dice «Quattro cose», e se un giorno se ne aggiunge un quinto
          # senza toccarla la pagina si contraddice da sola.
          n=$(grep -o 'class="impegni-n"' <<<"$html" | wc -l)
          parola=$(sed -n 's/.*class="impegni-cap">\([A-Za-z]*\) .*/\1/p' <<<"$html" | head -1)
          case "$parola" in
            Due)     atteso=2 ;;
            Tre)     atteso=3 ;;
            Quattro) atteso=4 ;;
            Cinque)  atteso=5 ;;
            Sei)     atteso=6 ;;
            *)       echo "::error::non riconosco il numero scritto nella frase degli impegni: «$parola»"; fail=1; atteso=$n ;;
          esac
          if [ "$n" = "$atteso" ]; then echo "  ok    la frase dice «$parola» e gli impegni sono $n"
          else echo "::error::la frase dice «$parola» ($atteso) ma gli impegni elencati sono $n"; fail=1; fi
          # E le schede dei servizi devono riempire la griglia: con quattro schede
          # su tre colonne restava un buco, che è il motivo per cui la griglia è
          # passata a due colonne.
          schede=$(grep -o 'class="card reveal' <<<"$html" | wc -l)
          colonne=$(grep -c 'grid-template-columns:repeat(2,1fr)' public/css/style.css)
          if [ "$colonne" -lt 1 ]; then
            echo "::error::la griglia delle schede non è più a due colonne: con $schede schede si riapre il buco"
            fail=1
          elif [ $((schede % 2)) != 0 ]; then
            echo "::error::$schede schede su due colonne lasciano un buco nell'ultima riga"
            fail=1
          else
            echo "  ok    $schede schede, due colonne, nessun buco"
          fi
          exit $fail

      # Lo stack dichiara solo ciò che il progetto conferma. Ogni voce del primo
      # elenco ha una prova in un file del repository: se la prova cade, la voce
      # deve cadere con lei — altrimenti la sezione ricomincia a essere un elenco
      # di parole, che è esattamente il difetto che è stato corretto.
      - name: Lo stack elenca solo quello che gira davvero
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          nomi=$(grep -o 'class="gira-v"><b>[^<]*' <<<"$html" | sed 's/.*<b>//')
          [ -n "$nomi" ] || { echo "::error::nessuna voce nell'elenco di quello che gira"; exit 1; }
          while read -r nome; do
            [ -n "$nome" ] || continue
            case "$nome" in
              Astro)      prova=$(grep -c '"astro":' package.json) ;;
              TypeScript) prova=$(grep -c '"typescript":' package.json) ;;
              Node)       prova=$(grep -c '"@astrojs/node":' package.json) ;;
              PostgreSQL) prova=$(grep -c '"pg":' package.json) ;;
              Docker)     prova=$(grep -c '^FROM ' deploy-docker/Dockerfile) ;;
              *)          echo "::error::«$nome» è nell'elenco ma non ha una prova dichiarata"; fail=1; continue ;;
            esac
            if [ "$prova" -ge 1 ]; then echo "  ok    $nome ha la sua prova nel progetto"
            else echo "::error::«$nome» è mostrato ma la sua prova non c'è più"; fail=1; fi
          done <<<"$nomi"
          # Nessuna voce può stare in entrambi gli elenchi: «gira qui» e «lavoro
          # anche con» dicono due cose diverse, e sovrapporle le annulla.
          nastro=$(sed -n 's/.*class="marquee-track">\(.*\)/\1/p' <<<"$html" | head -1)
          while read -r nome; do
            [ -n "$nome" ] || continue
            if grep -qF ">$nome<" <<<"$nastro"; then
              echo "::error::«$nome» è sia fra quelle che girano sia nel nastro delle competenze"
              fail=1
            fi
          done <<<"$nomi"
          # E le versioni restano fuori: vedi la regola in src/lib/stato.ts.
          if grep -oE 'class="gira-v">.{0,120}' <<<"$html" | grep -qE '[0-9]+\.[0-9]+'; then
            echo "::error::nell'elenco è comparso un numero di versione"
            fail=1
          else
            echo "  ok    nessun numero di versione pubblicato"
          fi
          exit $fail

      # Le cifre che salgono da zero all'ingresso nella vista devono avere il
      # valore d'arrivo già nell'HTML servito: quando erano uno zero risolto solo
      # dal JS, un visitatore senza JS leggeva "0" al posto del numero. Restano i
      # due KPI del mockup: le tre cifre dell'hero sono state sostituite dalla
      # prima domanda del configuratore.
      - name: Le cifre animate sono già nell'HTML servito
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          n=0
          while read -r coppia; do
            [ -n "$coppia" ] || continue
            n=$((n + 1))
            atteso=${coppia#*\"}; atteso=${atteso%%\"*}
            reso=${coppia##*>}; reso=${reso%<}
            if [ "$atteso" = "$reso" ]; then
              echo "  ok    cifra $atteso servita dal server"
            else
              echo "::error::servito \"$reso\" al posto di $atteso: senza JS è quello che si legge"
              fail=1
            fi
          done <<<"$(grep -oE '(data-count|data-to)="[0-9]+">[0-9]*<' <<<"$html")"
          if [ "$n" != "2" ]; then
            echo "::error::cifre animate trovate: $n, attese 2"
            fail=1
          fi
          exit $fail

      # Il sito PHP che c'era prima serviva CSS e JS con "access plus 7 days" nel
      # .htaccess: chi l'ha visitato nella settimana della migrazione riceveva
      # dalla propria cache lo style.css di allora insieme all'HTML nuovo, e
      # vedeva una pagina metà e metà — prezzi senza layout, logo stirato, barra
      # della stima come testo in fondo. Nessuna intestazione può cancellare
      # quelle voci: l'unico rimedio è chiedere un URL diverso.
      - name: CSS e JS sono chiesti con l'impronta del contenuto
        run: |
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0

          nudi=$(grep -oE '(href|src)="/(css|js)/[a-zA-Z0-9._-]+"' <<<"$html" || true)
          if [ -n "$nudi" ]; then
            echo "::error::riferimenti senza impronta, una cache avvelenata li servirebbe vecchi: $(tr '\n' ' ' <<<"$nudi")"
            fail=1
          else
            echo "  ok    nessun riferimento nudo a /css o /js"
          fi

          impronte=$(grep -oE '/(css|js)/[a-zA-Z0-9._-]+\?v=[a-f0-9]{10}' <<<"$html" | sort -u)
          n=$(wc -l <<<"$impronte")
          if [ "$n" != "3" ]; then
            echo "::error::asset con impronta trovati $n, attesi 3 (style.css, i18n.js, main.js)"
            fail=1
          fi
          for u in $impronte; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321$u")
            if [ "$code" = "200" ]; then echo "  ok    $u -> 200"
            else echo "::error::$u ha risposto $code"; fail=1; fi
          done

          # Senza questa, un HTML vecchio ripescato dalla cache continuerebbe a
          # puntare agli asset vecchi e la correzione non arriverebbe mai.
          cc=$(curl -s -D- -o /dev/null http://127.0.0.1:4321/ | grep -i '^cache-control:' | tr -d '\r')
          if grep -qi 'no-cache' <<<"$cc"; then echo "  ok    l'HTML si rivalida: $cc"
          else echo "::error::l'HTML non chiede la rivalidazione: '$cc'"; fail=1; fi
          exit $fail

      - name: La pagina pubblica non nomina l'AI
        run: |
          # Il confronto su "AI" è sensibile alle maiuscole di proposito: in
          # italiano "ai" è anche una preposizione ("risponde ai clienti"), e un
          # controllo indifferente al caso boccerebbe copy del tutto innocente.
          trovati=$(curl -s http://127.0.0.1:4321/ \
            | grep -oE "(^|[^A-Za-z])AI([^A-Za-z]|$)|[Ii]ntelligenza [Aa]rtificial|[Cc]hatbot|OpenAI|LLM|RAG" \
            | sort -u)
          if [ -n "$trovati" ]; then
            echo "::error::la home nomina ancora l'AI: $(tr '\n' ' ' <<<"$trovati")"
            exit 1
          fi
          echo "  ok    nessun riferimento all'AI nella pagina pubblica"

      - name: Il form contatti salva il lead
        run: |
          res=$(curl -s -H 'Origin: http://127.0.0.1:4321' -X POST \
            http://127.0.0.1:4321/api/contact \
            -F 'name=CI' -F 'email=ci@esempio.it' -F 'message=Prova automatica.')
          echo "  risposta: $res"
          echo "$res" | grep -q '"ok":true' || { echo "::error::invio rifiutato"; exit 1; }
          n=$(PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -tAc 'select count(*) from leads')
          [ "$n" = "1" ] || { echo "::error::lead nel database: $n, atteso 1"; exit 1; }

      - name: Un POST da altra origine viene rifiutato
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://altro.example' \
            -X POST http://127.0.0.1:4321/api/contact \
            -F 'name=X' -F 'email=x@y.it' -F 'message=z')
          [ "$code" = "403" ] || { echo "::error::atteso 403, ricevuto $code"; exit 1; }
          echo "  ok    origine esterna -> 403"

      # Regressione: il controllo di origine di Astro confronta Origin con
      # url.origin, e l'adapter Node ricava lo schema dal socket ignorando
      # X-Forwarded-Proto. Dietro un proxy che termina il TLS diventa
      # "https://sito" contro "http://sito" e ogni form legittimo prende 403.
      # Questi casi riproducono quella situazione: il server ascolta in chiaro
      # mentre il browser dichiara https.
      - name: Un invio dietro proxy con TLS terminato viene accettato
        run: |
          # Il form contatti accetta 5 invii ogni 15 minuti per IP, e i passi
          # precedenti ne hanno già consumati: senza azzerare il contatore questo
          # passo fallirebbe con 429 per esaurimento, non per il motivo in esame.
          PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -qc 'TRUNCATE rate_limits;'

          fail=0
          prova() {
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Host: $1" -H "X-Forwarded-Host: $1" -H 'X-Forwarded-Proto: https' \
              -H "Origin: https://$1" \
              -X POST http://127.0.0.1:4321/api/contact \
              -F 'name=Proxy' -F 'email=proxy@esempio.it' -F 'message=prova')
            if [ "$code" = "$2" ]; then echo "  ok    $3 -> $code"
            else echo "::error::$3 ha risposto $code, attesi $2"; fail=1; fi
          }
          prova dextlab.it               200 'host primario'
          prova www.dextlab.it           200 'host con www'
          prova sito.dextlab.duckdns.org 200 'host alternativo'

          # Con lo stesso schema dichiarato, un'origine estranea resta respinta.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: dextlab.it' -H 'X-Forwarded-Host: dextlab.it' -H 'X-Forwarded-Proto: https' \
            -H 'Origin: https://dextlab.it.evil.example' \
            -X POST http://127.0.0.1:4321/api/contact \
            -F 'name=X' -F 'email=x@y.it' -F 'message=z')
          if [ "$code" = "403" ]; then echo "  ok    host che inizia come il nostro -> 403"
          else echo "::error::atteso 403 per un host che solo somiglia al nostro, ricevuto $code"; fail=1; fi
          exit $fail

      # L'attribuzione è la sola cosa che rende la pubblicità misurabile: se il
      # contatto non porta con sé la campagna, dopo un mese di annunci l'unica
      # frase possibile è «mi pare che vada meglio». Questa guardia prova le due
      # direzioni, perché sbagliano in modi opposti e ugualmente costosi: la
      # campagna dichiarata deve arrivare intera fino al lead, e un contatto
      # senza campagna deve restare senza — mai ereditarne una a caso, mai
      # accettarne una da un campo nascosto manomesso.
      - name: Un contatto sa da dove arriva
        run: |
          fail=0
          sql() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -tAc "$1"; }
          esegui() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -qc "$1"; }
          uguale() {
            if [ "$2" = "$3" ]; then echo "  ok    $1: $2"
            else echo "::error::$1: atteso «$3», trovato «$2»"; fail=1; fi
          }

          # I passi precedenti hanno consumato il limite del form contatti: senza
          # azzerarlo questa guardia fallirebbe con 429, cioè per il motivo
          # sbagliato. Vale anche per le riesecuzioni sullo stesso database.
          # Il limite dell'accesso conta anche i tentativi riusciti (5 ogni 10
          # minuti per utente): l'ultimo passo di questa guardia entra nel
          # pannello, e su una riesecuzione ravvicinata prenderebbe «Troppi
          # tentativi» invece di guardare la pagina.
          esegui "DELETE FROM rate_limits WHERE rl_key LIKE 'contact:%' OR rl_key LIKE 'login%';"

          UA='Mozilla/5.0 (X11; Linux x86_64) GuardiaCampagne/1.0'
          ALTRO='Mozilla/5.0 (Macintosh; Intel Mac OS X) AltroBrowser/1.0'

          # 1. Arrivo dall'annuncio. Le maiuscole del link devono sparire: se
          #    «Google» e «google» restano distinti, un canale si spezza in due.
          home=$(curl -s -A "$UA" \
            'http://127.0.0.1:4321/?utm_source=Google&utm_medium=CPC&utm_campaign=Guardia-CI')
          vt=$(grep -o 'name="vt" value="[a-f0-9]\{16\}"' <<<"$home" | head -1 | grep -o '[a-f0-9]\{16\}')
          if [ -z "$vt" ]; then echo "::error::il modulo contatti non porta il token della visita"; exit 1; fi
          echo "  ok    il modulo porta il token della visita"
          uguale 'la visita registra la campagna' \
            "$(sql "select camp_source||'/'||camp_medium||'/'||camp_name from visits where token='$vt'")" \
            'google/cpc/guardia-ci'

          # 2. Seconda pagina della stessa visita: i parametri non ci sono più, e
          #    l'origine si eredita. Senza questo passaggio ogni contatto scritto
          #    dopo aver girato il sito risulterebbe diretto.
          curl -s -o /dev/null -A "$UA" -H 'Referer: http://127.0.0.1:4321/' http://127.0.0.1:4321/prenota
          uguale 'la pagina successiva eredita la campagna' \
            "$(sql "select camp_source||'/'||camp_medium||'/'||camp_name from visits where path='/prenota' order by id desc limit 1")" \
            'google/cpc/guardia-ci'

          # 3. Il contatto eredita l'origine dalla visita che ha reso il modulo.
          curl -s -o /dev/null -A "$UA" -H 'Origin: http://127.0.0.1:4321' -X POST \
            http://127.0.0.1:4321/api/contact \
            -F 'name=Guardia' -F 'email=guardia@esempio.it' -F 'message=Prova attribuzione.' -F "vt=$vt"
          uguale 'il lead porta la campagna e la pagina' \
            "$(sql "select camp_source||'/'||camp_medium||'/'||camp_name||' da '||pagina from leads where email='guardia@esempio.it' order by id desc limit 1")" \
            'google/cpc/guardia-ci da /'

          # 4. Controprova: senza token il contatto è diretto. L'assenza del dato
          #    si registra come assenza, non come ipotesi.
          curl -s -o /dev/null -H 'Origin: http://127.0.0.1:4321' -X POST \
            http://127.0.0.1:4321/api/contact \
            -F 'name=Diretto' -F 'email=diretto@esempio.it' -F 'message=Nessun token.'
          uguale 'un contatto senza token resta diretto' \
            "$(sql "select coalesce(nullif(camp_source,''),'(vuoto)') from leads where email='diretto@esempio.it' order by id desc limit 1")" \
            '(vuoto)'

          # 5. Controprova: un token inventato non trova nessuna visita, quindi
          #    non può scrivere valori arbitrari nelle statistiche.
          curl -s -o /dev/null -H 'Origin: http://127.0.0.1:4321' -X POST \
            http://127.0.0.1:4321/api/contact \
            -F 'name=Falso' -F 'email=falso@esempio.it' -F 'message=Token inventato.' \
            -F 'vt=ffffffffffffffff'
          uguale 'un token inventato non porta origine' \
            "$(sql "select coalesce(nullif(camp_source,''),'(vuoto)') from leads where email='falso@esempio.it' order by id desc limit 1")" \
            '(vuoto)'

          # 6. Ricerca organica: il referer di un motore vale «organico», non
          #    «cpc». Confonderli significa non sapere quale traffico si paga.
          curl -s -o /dev/null -A "$ALTRO" -H 'Referer: https://www.google.com/search?q=siti+web' \
            http://127.0.0.1:4321/
          uguale 'una visita dalla ricerca è organica' \
            "$(sql "select camp_source||'/'||camp_medium from visits where ua like '%AltroBrowser%' order by id desc limit 1")" \
            'google/organico'

          # 7. Controprova dell'ereditarietà: un altro browser sulla stessa
          #    macchina NON deve prendersi la campagna del primo. L'IP è
          #    troncato per il GDPR, quindi da solo non identifica nessuno.
          curl -s -o /dev/null -A 'TerzoBrowser/1.0' http://127.0.0.1:4321/
          uguale "l'origine non passa a un altro browser" \
            "$(sql "select coalesce(nullif(camp_source,''),'(vuoto)') from visits where ua like 'TerzoBrowser%' order by id desc limit 1")" \
            '(vuoto)'

          # 8. La pagina del pannello mostra il canale e costruisce i link con la
          #    stessa normalizzazione della lettura: un link che esce da lì deve
          #    produrre righe che quella pagina sa raggruppare.
          jar=/tmp/mkt.jar
          csrf=$(curl -s -c $jar http://127.0.0.1:4321/admin | grep -oE '[a-f0-9]{64}' | head -1)
          curl -s -b $jar -c $jar -o /dev/null -H 'Origin: http://127.0.0.1:4321' \
            -X POST http://127.0.0.1:4321/admin \
            -d "csrf=$csrf&username=ci_admin&password=password-ci-molto-lunga"
          mkt=$(curl -s -b $jar 'http://127.0.0.1:4321/admin/marketing?src=Google%20Ads&med=CPC&camp=Guardia%20CI&dest=/prenota')
          for atteso in 'guardia-ci' '>Google<' 'utm_source=google+ads' 'utm_medium=cpc' 'utm_campaign=guardia+ci' '/prenota'; do
            if grep -qF "$atteso" <<<"$mkt"; then echo "  ok    la pagina Marketing contiene $atteso"
            else echo "::error::la pagina Marketing non contiene $atteso"; fail=1; fi
          done

          exit $fail

      # Due regole separate, e la separazione è il punto (vedi la 015). L'offerta
      # di un servizio dipende da un interruttore: si accende e la pagina esiste.
      # La DICHIARAZIONE di una certificazione dipende dal dato: senza l'ente che
      # l'ha rilasciata, quel titolo non è verificabile e la pagina non lo nomina.
      # Prima erano legate, e il risultato era un servizio invisibile perché
      # mancava l'anno di un attestato. Questa guardia protegge entrambe, e
      # soprattutto il confine: la pagina può vendere il lavoro senza mai
      # affermare un titolo che non può mostrare.
      - name: Il servizio si offre, la qualifica si dichiara solo se c'è
        run: |
          fail=0
          esegui() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -qc "$1"; }
          uguale() {
            if [ "$2" = "$3" ]; then echo "  ok    $1: $2"
            else echo "::error::$1: atteso «$3», trovato «$2»"; fail=1; fi
          }
          codice() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321$1"; }
          # Le occorrenze, non le righe: l'HTML reso mette più link sulla stessa.
          conta() { curl -s http://127.0.0.1:4321/ | grep -o 'href="/gdpr"' | wc -l | tr -d ' '; }
          # Le qualifiche dichiarate nei dati strutturati, in JSON. Su una riga sola
          # perché dentro un blocco YAML ogni riga porta la sua rientratura, e
          # Python la leggerebbe come indentazione sbagliata.
          ld() {
            curl -s http://127.0.0.1:4321/ | python3 -c "import sys,re,json;h=sys.stdin.read();m=re.search(r'ld[+]json\">(.*?)</script>',h,re.S);d=json.loads(m.group(1)) if m else {};o=d.get('@graph',[d]);a=next((x for x in o if x.get('@type')=='ProfessionalService'),{});print(json.dumps(a.get('hasCredential',[]),ensure_ascii=False))"
          }
          # Una parola che la pagina non deve contenere quando non c'è nessuna
          # qualifica dichiarata: è la prova che non si sta affermando un titolo.
          dice() { curl -s http://127.0.0.1:4321/gdpr | grep -oic "$1" | head -1; }

          # 1. Servizio spento: la pagina non esiste, e non la nomina nessuno.
          esegui "DELETE FROM credentials;"
          esegui "UPDATE settings SET v='' WHERE k='dpo_attiva';"
          uguale 'con il servizio spento la pagina non esiste' "$(codice /gdpr)" '404'
          uguale 'la home non la nomina' "$(conta)" '0'
          uguale 'la sitemap non la promette' \
            "$(curl -s http://127.0.0.1:4321/sitemap.xml | grep -c gdpr || true)" '0'

          # 2. Servizio acceso senza nessuna qualifica: la pagina esce e vende il
          #    lavoro, ma non nomina certificazioni e non ha la sezione che le
          #    mostra. È il caso normale finché nessuno ha compilato i dati.
          esegui "UPDATE settings SET v='1' WHERE k='dpo_attiva';"
          uguale 'il servizio acceso pubblica la pagina' "$(codice /gdpr)" '200'
          uguale 'la pagina descrive il servizio' \
            "$(curl -s http://127.0.0.1:4321/gdpr | grep -c 'DPO esterno')" '1'
          uguale 'senza qualifiche non c-e la sezione delle qualifiche' "$(dice 'Su cosa si basa')" '0'
          uguale 'senza qualifiche non nomina certificazioni' "$(dice 'certificat\|certificaz')" '0'
          uguale 'niente qualifiche nei dati strutturati' "$(ld)" '[]'
          # Menu, card dei servizi, piè di pagina: tre. Il quarto link nasce dalla
          # riga delle qualifiche in home, che ancora non c'è.
          uguale 'la home porta alla pagina' "$(conta)" '3'
          uguale 'la sitemap la dichiara' \
            "$(curl -s http://127.0.0.1:4321/sitemap.xml | grep -c '/gdpr' || true)" '1'

          # 3. Una riga con il titolo ma senza ente non cambia niente: un titolo
          #    che nessuno può smentire non è una qualifica.
          esegui "INSERT INTO credentials (title, issuer, active) VALUES ('Data Protection Officer', '', true);"
          uguale 'una qualifica senza ente non aggiunge la sezione' "$(dice 'Su cosa si basa')" '0'
          uguale 'una qualifica senza ente non entra nei dati strutturati' "$(ld)" '[]'
          uguale "una qualifica senza ente non aggiunge link in home" "$(conta)" '3'

          # 4. Qualifica completa: adesso la pagina la dichiara, e dice chi l'ha
          #    rilasciata.
          esegui "UPDATE credentials SET issuer='Ente di prova CI', scheme='UNI 11697:2017', year='2026', code='CI-1';"
          pagina=$(curl -s http://127.0.0.1:4321/gdpr)
          for atteso in 'Su cosa si basa' 'Ente di prova CI' 'UNI 11697:2017' 'CI-1'; do
            if grep -qF "$atteso" <<<"$pagina"; then echo "  ok    la pagina contiene $atteso"
            else echo "::error::la pagina non contiene $atteso"; fail=1; fi
          done
          uguale 'la qualifica aggiunge la riga in home' "$(conta)" '4'
          uguale 'i dati strutturati dicono chi ha rilasciato la qualifica' \
            "$(ld | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['recognizedBy']['name'])")" \
            'Ente di prova CI'
          uguale "l'anno è dichiarato" \
            "$(ld | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('dateCreated','(assente)'))")" \
            '2026'

          # 5. Un anno che non è un anno non diventa una data: il campo è testo
          #    libero, e «giugno 2026» in un dateCreated è un dato non valido —
          #    peggio di un dato in meno.
          esegui "UPDATE credentials SET year='giugno 2026';"
          uguale 'un anno scritto a parole non diventa una data' \
            "$(ld | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('dateCreated','(assente)'))")" \
            '(assente)'

          # 6. L'indirizzo di verifica arriva dal pannello e finisce in un href:
          #    solo http(s), come per i link dei lavori.
          esegui "UPDATE credentials SET url='javascript:alert(1)';"
          if curl -s http://127.0.0.1:4321/gdpr | grep -q 'javascript:alert'; then
            echo "::error::un indirizzo javascript: è finito in pagina"; fail=1
          else
            echo "  ok    un indirizzo non web viene scartato"
          fi

          # Si rimette come la trova la migrazione 015: servizio acceso, una bozza
          # da compilare, nessuna qualifica dichiarata.
          esegui "DELETE FROM credentials;"
          esegui "INSERT INTO credentials (title, issuer, active) VALUES ('Data Protection Officer', '', false);"
          uguale 'lo stato torna quello della migrazione' "$(codice /gdpr)" '200'

          exit $fail

      # Il difetto che questa guardia protegge è già capitato, ed è il peggiore
      # possibile: l'host della posta impostato al server IMAP invece che a quello
      # SMTP. Il modulo risponde «messaggio inviato», il pannello non dice niente,
      # e le email non arrivano — con l'agenda accesa significa che qualcuno
      # prenota una call e non riceve la conferma. Un guasto così non lo trova
      # nessuno guardando: deve essere il pannello a dirlo, appena si apre la
      # pagina e senza premere niente.
      - name: Un SMTP che non può spedire lo dice
        run: |
          fail=0
          esegui() { PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -qc "$1"; }
          imposta() {
            esegui "INSERT INTO settings (k, v) VALUES ('$1', '$2') ON CONFLICT (k) DO UPDATE SET v = '$2';"
          }
          # Il limite dell'accesso conta anche i tentativi riusciti: questa guardia
          # entra nel pannello, e le guardie prima di lei hanno già fatto un login.
          esegui "DELETE FROM rate_limits WHERE rl_key LIKE 'login%';"

          jar=/tmp/smtp.jar
          rm -f $jar
          csrf=$(curl -s -c $jar http://127.0.0.1:4321/admin | grep -oE '[a-f0-9]{64}' | head -1)
          curl -s -b $jar -c $jar -o /dev/null -H 'Origin: http://127.0.0.1:4321' \
            -X POST http://127.0.0.1:4321/admin \
            -d "csrf=$csrf&username=ci_admin&password=password-ci-molto-lunga"
          pagina() { curl -s -b $jar http://127.0.0.1:4321/admin/impostazioni; }

          contiene() {
            if grep -qF "$2" <<<"$1"; then echo "  ok    dice: $3"
            else echo "::error::non dice: $3"; fail=1; fi
          }
          non_contiene() {
            if grep -qF "$2" <<<"$1"; then echo "::error::non doveva dire: $3"; fail=1
            else echo "  ok    tace su: $3"; fi
          }

          # 1. SMTP spento: è una scelta legittima, ma va detta — senza posta il
          #    sito non risponde a nessuno.
          imposta smtp_enabled ''
          spento=$(pagina)
          contiene "$spento" 'Le email non partiranno' 'con SMTP spento avvisa'
          contiene "$spento" 'SMTP è spento' 'spiega perché'
          contiene "$spento" 'value="smtp_verifica" class="btn-s" disabled' 'la prova è disattivata senza configurazione'

          # 2. La configurazione sbagliata vera: host di lettura, e porta che non
          #    corrisponde alla modalità.
          imposta smtp_enabled '1'
          imposta smtp_host 'imaps.esempio.it'
          imposta smtp_user 'info@esempio.it'
          imposta smtp_pass 'segreto-di-prova'
          imposta smtp_port '465'
          imposta smtp_secure 'tls'
          storto=$(pagina)
          contiene "$storto" 'server per leggere la posta' 'che un host IMAP non spedisce'
          contiene "$storto" 'smtps.esempio.it' "l'host giusto da provare"
          contiene "$storto" 'La porta 465 vuole «ssl»' 'che porta e modalità non corrispondono'

          # 3. Configurazione coerente: l'avviso deve sparire del tutto. Un
          #    pannello che avvisa sempre non avvisa mai.
          imposta smtp_host 'smtps.esempio.it'
          imposta smtp_secure 'ssl'
          giusto=$(pagina)
          non_contiene "$giusto" 'Le email non partiranno' 'una configurazione coerente'
          contiene "$giusto" 'value="smtp_prova" class="btn-s"' 'la prova è disponibile'
          non_contiene "$giusto" 'value="smtp_prova" class="btn-s" disabled' 'un pulsante disattivato'

          # 4. La prova riporta l'errore vero e non un riassunto: «ECONNREFUSED» e
          #    «Invalid login» sono la differenza fra un host sbagliato e una
          #    password sbagliata, ed è l'unica informazione utile.
          imposta smtp_host '127.0.0.1'
          imposta smtp_port '2525'
          imposta smtp_secure 'ssl'
          csrf=$(pagina | grep -oE 'name="csrf" value="[a-f0-9]{64}"' | head -1 | grep -oE '[a-f0-9]{64}')
          curl -s -b $jar -c $jar -o /dev/null -H 'Origin: http://127.0.0.1:4321' \
            -X POST http://127.0.0.1:4321/admin/impostazioni -d "csrf=$csrf&action=smtp_verifica"
          esito=$(curl -s -b $jar -c $jar http://127.0.0.1:4321/admin/impostazioni)
          contiene "$esito" 'ECONNREFUSED' "l'errore esatto della connessione"

          # Si rimette la configurazione come stava: le altre guardie leggono le
          # stesse impostazioni, e una posta finta accesa cambierebbe i loro esiti.
          imposta smtp_enabled ''
          imposta smtp_host ''
          imposta smtp_user ''
          imposta smtp_pass ''
          imposta smtp_port '465'
          imposta smtp_secure 'ssl'
          exit $fail

      - name: Backup e ripristino su database vuoto
        run: |
          # Il numero atteso viene letto dal database di partenza, non scritto a
          # mano: così aggiungere un test che salva un lead non rompe questo.
          atteso=$(PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext -tAc 'select count(*) from leads')
          [ "$atteso" -gt 0 ] || { echo "::error::nessun lead da cui partire: il ripristino non verificherebbe nulla"; exit 1; }
          npm run backup
          file=$(ls /tmp/ci-backups/*.sql.gz | head -1)
          echo "  dump: $file"
          PGPASSWORD=dext_ci createdb -h 127.0.0.1 -U dext dext_restore
          gunzip -c "$file" | PGPASSWORD=dext_ci psql -q -h 127.0.0.1 -U dext -d dext_restore
          n=$(PGPASSWORD=dext_ci psql -h 127.0.0.1 -U dext -d dext_restore -tAc 'select count(*) from leads')
          [ "$n" = "$atteso" ] || { echo "::error::lead dopo il ripristino: $n, attesi $atteso"; exit 1; }
          echo "  ok    ripristino verificato ($n lead)"

      - name: Log del server in caso di errore
        if: failure()
        run: cat /tmp/server.log || true

  migrazione-da-php:
    name: Aggiornamento di un database PHP esistente
    runs-on: ubuntu-latest

    # Il percorso più delicato dell'aggiornamento: un database creato da
    # install.php ha tipi diversi (SMALLINT invece di BOOLEAN, TIMESTAMP senza
    # fuso) e 001_init.sql, usando CREATE TABLE IF NOT EXISTS, non lo tocca.
    # Senza la migrazione 003 il sito risponderebbe 200 servendo i contenuti di
    # fallback al posto di quelli reali: un guasto silenzioso.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dext
          POSTGRES_PASSWORD: dext_ci
          POSTGRES_DB: dext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: dext
      DB_USER: dext
      DB_PASS: dext_ci
      APP_SECRET: ci_only_secret_0123456789abcdef0123456789abcd
      SITE_URL: http://127.0.0.1:4321
      PGPASSWORD: dext_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ricrea un database in stile PHP con dati reali
        run: psql -h 127.0.0.1 -U dext -d dext -v ON_ERROR_STOP=1 -f .github/fixtures/schema-php.sql

      - name: La prova a vuoto non modifica nulla
        run: |
          npm run migrate -- --dry-run
          tipo=$(psql -h 127.0.0.1 -U dext -d dext -tAc \
            "select data_type from information_schema.columns where table_name='pricing_types' and column_name='active'")
          [ "$tipo" = "smallint" ] || { echo "::error::il dry-run ha modificato lo schema ($tipo)"; exit 1; }
          n=$(psql -h 127.0.0.1 -U dext -d dext -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name='schema_migrations'")
          [ "$n" = "0" ] || { echo "::error::il dry-run ha lasciato la tabella schema_migrations"; exit 1; }
          echo "  ok    nessuna traccia lasciata dalla prova a vuoto"

      - name: Applica le migrazioni
        run: npm run migrate

      - name: I dati reali sono sopravvissuti
        run: |
          q() { psql -h 127.0.0.1 -U dext -d dext -tAc "$1"; }
          fail=0
          expect() {
            got=$(q "$2")
            if [ "$got" = "$3" ]; then echo "  ok    $1 = $got"
            else echo "::error::$1 = $got, atteso $3"; fail=1; fi
          }
          expect "tipi progetto"      "select count(*) from pricing_types" 3
          expect "tipi attivi"        "select count(*) from pricing_types where active" 2
          # Non il numero di righe: quello che deve sopravvivere sono i DUE addon
          # reali. La 014 ne aggiunge uno suo — «Adeguamento privacy e cookie»,
          # spento e a zero — e contare le righe farebbe fallire questa guardia
          # per una riga in più invece che per un dato perduto, che è la cosa che
          # deve controllare. Le due righe si verificano per nome, e la nuova si
          # verifica per come deve entrare: spenta, così il configuratore non la
          # mostra finché nessuno le ha dato un prezzo.
          expect "addon reali"        "select count(*) from pricing_addons where label in ('Multilingua','SEO locale')" 2
          expect "prezzi addon reali" "select sum(price) from pricing_addons where label in ('Multilingua','SEO locale')" 840
          expect "addon della 014"    "select count(*) from pricing_addons where label = 'Adeguamento privacy e cookie' and not active and price = 0" 1
          expect "recensioni"         "select count(*) from reviews" 2
          expect "lead"               "select count(*) from leads" 2
          expect "lead senza data"    "select count(*) from leads where created_at is null" 0
          expect "visite"             "select count(*) from visits" 2
          expect "visite umane"       "select count(*) from visits where human" 1
          expect "segreto SMTP"       "select v from settings where k='smtp_pass'" "segreto-smtp-da-conservare"
          # La 003 conservava la chiave; la 004 la elimina insieme al resto della
          # configurazione del chatbot. Verificare la rimozione vale più che
          # verificare la conservazione: quella chiave era un segreto in chiaro.
          expect "impostazioni AI rimosse" "select count(*) from settings where k in ('ai_enabled','ai_provider','ai_model','ai_api_key')" 0
          expect "setting NULL"       "select v from settings where k='tg_chat'" ""
          expect "stelle fuori range" "select stars from reviews where author='Caso Limite'" 5
          expect "hash admin PHP"     "select left(pass_hash,4) from admins" '$2y$'
          exit $fail

      - name: Lo schema è quello atteso
        run: |
          fail=0
          check_type() {
            got=$(psql -h 127.0.0.1 -U dext -d dext -tAc \
              "select data_type from information_schema.columns where table_name='$1' and column_name='$2'")
            if [ "$got" = "$3" ]; then echo "  ok    $1.$2 -> $got"
            else echo "::error::$1.$2 è $got, atteso $3"; fail=1; fi
          }
          check_type pricing_types active         boolean
          check_type faqs          active         boolean
          check_type visits        is_maintenance boolean
          check_type visits        human          boolean
          check_type leads         created_at     'timestamp with time zone'
          check_type visits        created_at     'timestamp with time zone'
          check_type rate_limits   reset_at       'timestamp with time zone'
          check_type reviews       stars          smallint
          exit $fail

      - name: Le migrazioni restano idempotenti
        run: |
          out=$(npm run --silent migrate)
          echo "$out"
          echo "$out" | grep -q 'già aggiornato' || {
            echo "::error::una seconda esecuzione ha riapplicato delle migrazioni"; exit 1; }

      - run: npm run build

      - name: Il sito serve i contenuti reali, non i fallback
        run: |
          node ./dist/server/entry.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:4321/api/health && break
            sleep 0.5
          done
          html=$(curl -s http://127.0.0.1:4321/)
          fail=0
          present() {
            if grep -q "$1" <<<"$html"; then echo "  ok    presente: $2"
            else echo "::error::manca dalla pagina: $2"; fail=1; fi
          }
          absent() {
            if grep -q "$1" <<<"$html"; then echo "::error::non doveva comparire: $2"; fail=1
            else echo "  ok    assente: $2"; fi
          }
          present 'Landing su misura'   'tipo progetto personalizzato'
          present 'data-price="690"'    'prezzo reale del cliente'
          present 'Recensione autentica del cliente' 'recensione reale'
          present 'Domanda personalizzata'           'FAQ reale'
          present 'wa.me/393339998877'  'numero WhatsApp reale'
          present 'contatti@dextlab.it' 'email di contatto reale'
          absent  'Vecchio pacchetto'   'tipo disattivato'
          # Se comparissero questi, il sito starebbe servendo i fallback.
          absent  'data-price="4500"'   'prezzo predefinito del codice'
          absent  'Marco R.'            'recensione predefinita del codice'
          n=$(grep -o 'class="cfg-type' <<<"$html" | wc -l)
          [ "$n" = "2" ] || { echo "::error::tipi nel configuratore: $n, attesi 2"; fail=1; }
          echo "  ok    tipi nel configuratore: $n"
          exit $fail

      - name: Il login funziona con l'hash prodotto da PHP
        run: |
          jar=/tmp/cookie.jar
          csrf=$(curl -s -c $jar http://127.0.0.1:4321/admin | grep -oE '[a-f0-9]{64}' | head -1)
          code=$(curl -s -b $jar -c $jar -o /dev/null -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:4321' -X POST http://127.0.0.1:4321/admin \
            -d "csrf=$csrf&username=samuele&password=password-di-prova")
          [ "$code" = "303" ] || { echo "::error::login fallito con codice $code"; exit 1; }
          echo "  ok    accesso riuscito con hash \$2y\$ di PHP"
          # I lead storici devono comparire nella dashboard, che filtra per data.
          dash=$(curl -s -b $jar http://127.0.0.1:4321/admin)
          grep -q 'Lead totali' <<<"$dash" || { echo "::error::dashboard non caricata"; exit 1; }
          echo "  ok    dashboard raggiungibile"

      - name: Log del server in caso di errore
        if: failure()
        run: cat /tmp/server.log || true

# Dext Lab — si aggancia al Traefik ESISTENTE (rete "proxy", resolver "letsencrypt")
# e al PostgreSQL ESISTENTE (container "postgres", gestito da pgAdmin).
# NON avvia né Traefik né un proprio DB. Avvio: cd deploy-docker && docker compose up -d --build

services:
  web:
    build:
      context: ..
      dockerfile: deploy-docker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - proxy
    volumes:
      - ./data/backups:/var/www/html/backups
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.dext.rule=Host(`${SITE_HOST}`)"
      - traefik.http.routers.dext.entrypoints=websecure
      - traefik.http.routers.dext.tls=true
      - traefik.http.routers.dext.tls.certresolver=letsencrypt
      - traefik.http.services.dext.loadbalancer.server.port=80
      - "traefik.http.routers.dext.middlewares=dext-sec"
      - traefik.http.middlewares.dext-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.dext-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.dext-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.dext-sec.headers.stsIncludeSubdomains=true

networks:
  proxy:
    external: true
